replicaCount: 1

image:
  repository: kubewaf-operator
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Namespace where the platform mounts ConfigMap kubewaf-seclang.
# This chart does not choose a Composer image or how the .so is delivered.
proxyNamespace: envoy-gateway-system

serviceAccount:
  create: true
  name: ""

leaderElection:
  enabled: true

webhooks:
  enabled: true
  failurePolicy: Fail

metrics:
  enabled: true

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
