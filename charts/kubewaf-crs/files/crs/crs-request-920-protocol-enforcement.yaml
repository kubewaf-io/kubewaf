    seclang.kubewaf.io/id: "920520"
    seclang.kubewaf.io/order: "920520"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.255.153: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920520
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - arguments:
      - Accept-Encoding
      name: REQUEST_HEADERS
    operator:
      name: gt
      value: "100"
    transformations:
    - none
    - lowercase
    - length
  metadata:
    comment: |+
      Rule against CVE-2022-21907
      This rule blocks Accept-Encoding headers longer than 100 characters.
      The length of 100 is a heuristic based on the length of values from
      the RFC (https://datatracker.ietf.org/doc/rfc9110/)
      and the respective values assigned by IANA
      (https://www.iana.org/assignments/http-parameters/http-parameters.xml#content-coding).
      Concatenating all valid values for Accept-Encoding (without q=0.5) resulted in a value of 93:
      aes128gcm, br, compress, deflate, exi, gzip, identity, pack200-gzip, x-compress, x-gzip, zstd

      This rule has a stricter sibling: 920521

    id: 920520
    message: Accept-Encoding header exceeded sensible length
    phase: "1"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/255/153
