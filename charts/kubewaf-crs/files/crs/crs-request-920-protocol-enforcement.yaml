apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920640"
    seclang.kubewaf.io/order: "920640"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920640
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - operator:
      name: gt
      value: "0"
    transformations:
    - none
    variables:
    - name: REQUEST_BODY_LENGTH
  - collections:
    - arguments:
      - Content-Type
      count: true
      name: REQUEST_HEADERS
    operator:
      name: eq
      value: "0"
    transformations:
    - none
  metadata:
    comment: |+
      Missing Content-Type Header with Request Body (Phase 2)

      -=[ Rule Logic ]=-
      This rule checks if the actual REQUEST_BODY_LENGTH is greater than zero
      (indicating a body was received), then verifies the existence of the
      Content-Type header. This operates in phase:2 (request body) and complements
      rule 920340 which checks in phase:1 based on the Content-Length header.

      This rule catches evasion attempts where:
      - The Content-Length header was omitted entirely
      - The Content-Length header was set to zero but a body was sent anyway
      - The request bypassed phase:1 checks but still contains a body

      Without a Content-Type header, the Request Body Processor cannot properly
      parse the body content (XML, JSON, multipart, etc.), allowing attackers to
      hide malicious payloads from inspection unless tx.enforce_bodyproc_urlencoded
      is configured.

      -=[ References ]=-
      https://httpwg.org/specs/rfc7231.html#header.content-type
      https://httpwg.org/specs/rfc7230.html#message.body

    id: 920640
    message: Content-Type header missing from request with body
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
