apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920170"
    seclang.kubewaf.io/order: "920170"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920170
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
  match:
  - operator:
      name: rx
      value: ^(?:GET|HEAD)$
    transformations:
    - none
    variables:
    - name: REQUEST_METHOD
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
    collections:
    - arguments:
      - Content-Length
      name: REQUEST_HEADERS
    operator:
      name: rx
      negate: true
      value: ^0?$
    transformations:
    - none
  metadata:
    comment: |+
      Do not accept GET or HEAD requests with bodies
      In RCF-9110, "A client SHOULD NOT generate content in a HEAD/GET request
      unless it is made directly to an origin server that has previously indicated"

      -=[ Rule Logic ]=-
      The chained rule matches when:
      1) If the request method is GET or HEAD
      AND
      2) Header: Content-Length exists and non-zero

      -=[ References ]=-
      https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.1
      https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.2

    id: 920170
    message: GET or HEAD Request with Body Content
    phase: "1"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
  order: 920170
---
