apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920460"
    seclang.kubewaf.io/order: "920460"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.153.267: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.4: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920460
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.http_violation_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl4=+%{tx.critical_anomaly_score}
  markerAfter: END-REQUEST-920-PROTOCOL-ENFORCEMENT
  match:
  - collections:
    - name: REQUEST_HEADERS
    - name: ARGS
    - name: ARGS_NAMES
    operator:
      name: rx
      value: (?:^|[^\x5c])\x5c[cdeghijklmpqwxyz123456789]
    transformations:
    - none
    - htmlEntityDecode
    - lowercase
    variables:
    - name: REQUEST_URI
  metadata:
    comment: |+
      -=[ Abnormal Character Escapes ]=-

      [ Rule Logic ]
      Consider the following payload: arg=cat+/e\tc/pa\ssw\d
      Here, \s and \d were only used to obfuscate the string passwd and a lot of
      parsers will silently ignore the non-necessary escapes. The case with \t is
      a bit different though, as \t is a natural escape for the TAB character,
      so we will avoid this (and \n, \r, etc.).

      This rule aims to detect non-necessary, abnormal escapes. You could say it is
      a nice way to forbid the backslash character where it is not needed.

      This is a new rule at paranoia level 4. We expect quite a few false positives
      for this rule and we will later evaluate if the rule makes any sense at all.
      The rule is redundant with 920273 and 920274 in PL4. But if the rule proofs
      to be useful and false positives remain at a reasonable level, then it might
      be shifted to PL3 in a future release, where it would be the only rule
      covering the backslash escape.

      We forbid backslashes followed by a list of basic ascii characters - unless
      the backslash is preceded by another backslash.

      This rule is also triggered by the following exploit(s):
      [ SAP CRM Java vulnerability CVE-2018-2380 - Exploit tested: https://www.exploit-db.com/exploits/44292 ]

    id: 920460
    message: Abnormal character escapes in request
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/4
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/153/267
  order: 920460
