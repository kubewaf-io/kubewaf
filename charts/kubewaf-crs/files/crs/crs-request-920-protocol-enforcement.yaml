    phase: "2"
    severity: WARNING
    tags:
    - application-multi
    - language-multi
    - platform-iis
    - platform-windows
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
