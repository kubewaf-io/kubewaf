kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920350"
    seclang.kubewaf.io/order: "920350"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920350
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}
  match:
  - collections:
    - arguments:
      - Host
      name: REQUEST_HEADERS
    operator:
      name: rx
      value: (?:^([\d.]+|\[[\da-f:]+\]|[\da-f:]+)(:[\d]+)?$)
    transformations:
    - none
  metadata:
    comment: |+
      Check that the host header is not an IP address
      This is not an HTTP RFC violation but it is indicative of automated client access.
      Many web-based worms propagate by scanning IP address blocks.

      -=[ Rule Logic ]=-
      This rule triggers if the Host header contains an IPv4 or IPv6 address, optionally
      extended with a port number. In the case of IPv6 we covering the address with square
      brackets and the address without square brackets.

      The regex consists of three main parts and said optional group:

      * IPv4 address
      * IPv6 address with square brackets
      * IPv6 address without square brackets
      * optional colon and port number

      Please note that the regex does not test the validity of the IP addresses.
      It just tries to detect a potential IP address.

      -=[ References ]=-
      https://technet.microsoft.com/en-us/magazine/2005.01.hackerbasher.aspx

    id: 920350
    message: Host header is a numeric IP address
    phase: "1"
    severity: WARNING
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
  order: 920350
