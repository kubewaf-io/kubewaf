apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920510"
    seclang.kubewaf.io/order: "920510"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.header-allowlist: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.3: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920510
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: 'Invalid Cache-Control value in request found within %{MATCHED_VAR_NAME}:
        %{MATCHED_VAR}'
  match:
  - collections:
    - arguments:
      - Cache-Control
      count: true
      name: REQUEST_HEADERS
    operator:
      name: gt
      value: "0"
    transformations:
    - none
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl3=+%{tx.critical_anomaly_score}
    collections:
    - arguments:
      - Cache-Control
      name: REQUEST_HEADERS
    operator:
      name: rx
      negate: true
      value: ^(?:(?:max-age=[0-9]+|min-fresh=[0-9]+|no-cache|no-store|no-transform|only-if-cached|max-stale(?:=[0-9]+)?)(?:\s*\,\s*|$)){1,7}$
  metadata:
    comment: |+
      Cache-Control Request Header allow list

      -=[ Rule Logic ]=-
      This rule aims to strictly allow list the Cache-Control request header
      values and to blocks all violations. This should be useful to intercept
      "bad bot" and tools that impersonate a real browser but with wrong request
      header setup.

      The regular expression used on this rule tries to match multiple directives
      in a single value, for example: "max-stale=1, max-age=2". This leads us to
      use a regular expression that accepts a trailing comma to keep compatibility
      with all regex engines and not PCRE only. For example: "max-stale=1, max-age=2, "

      Moreover, this regular expression allows duplicate directives sequence like:
      "max-stale, max-stale=1, no-cache, no-cache".

      Standard Cache-Control directives that can be used by the client:
        - max-age=<seconds>
        - max-stale[=<seconds>]
        - min-fresh=<seconds>
        - no-cache
        - no-store
        - no-transform
        - only-if-cached

      References:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control
      - https://regex101.com/r/CZ0Hxu/22

    id: 920510
    message: Invalid Cache-Control request header
    phase: "1"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - header-allowlist
    - paranoia-level/3
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
  order: 920510
