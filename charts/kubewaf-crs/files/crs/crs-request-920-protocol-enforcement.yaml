kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920190"
    seclang.kubewaf.io/order: "920190"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920190
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
  match:
  - collections:
    - arguments:
      - Range
      name: REQUEST_HEADERS
    operator:
      name: rx
      value: (\d+)-(\d+)
    transformations:
    - none
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}
    collections:
    - arguments:
      - "2"
      name: TX
    operator:
      name: lt
      value: '%{tx.1}'
  metadata:
    comment: |+
      Range Header Check

      RFC7233 2.1 p6:
      "A byte-range-spec is invalid if the last-byte-pos value is present
      and less than the first-byte-pos."

      -=[ Rule Logic ]=-
      This rule compares the first and second byte ranges and flags
      when the first value is greater than the second.

      -=[ References ]=-
      https://datatracker.ietf.org/doc/html/rfc7233
      https://seclists.org/fulldisclosure/2011/Aug/175

    id: 920190
    message: 'Range: Invalid Last Byte Value'
    phase: "1"
    severity: WARNING
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
