apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920660"
    seclang.kubewaf.io/order: "920660"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920660
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}
  match:
  - collections:
    - arguments:
      - Request-Range
      count: true
      name: REQUEST_HEADERS
    operator:
      name: gt
      value: "0"
    transformations:
    - none
  metadata:
    comment: |
      The `Request-Range` header is a legacy/non-standard HTTP header that dates back to Netscape
      Navigator 2-3 and MSIE 3 (~1996-1997). It was never part of any HTTP RFC and has no legitimate
      use in modern web traffic.

      # Background

      ## Origin of `Request-Range`

      The header originated from an early draft of HTTP byte-range requests before standardization:

      - **Draft standard**: Defined `Request-Range` header with `multipart/x-byteranges` response type
      - **HTTP/1.1 (RFC 2068/7233/9110)**: Standardized as `Range` header with `multipart/byteranges` response type
      - **Netscape Navigator 2-3**: Sent **both** `Range` and `Request-Range` headers (with the same value)
      - **Netscape Communicator 4+**: Dropped the non-standard `Request-Range` header

      Rationale for Blocking

      | Factor                    | Assessment                                                    |
      |---------------------------|---------------------------------------------------------------|
      | **Legitimate modern use** | None - header is ~25 years obsolete                           |
      | **Last known clients**    | Netscape Navigator 2-3, MSIE 3 (1996-1997)                    |
      | **False positive risk**   | Essentially zero                                              |
      | **Attack surface**        | Servers may still process it; could bypass `Range`-only rules |
      | **RFC status**            | Never standardized; not in RFC 9110                           |
    id: 920660
    message: Obsolete Request-Range header detected
    phase: "1"
    severity: WARNING
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
  order: 920660
