apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920180"
    seclang.kubewaf.io/order: "920180"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920180
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
  match:
  - operator:
      name: within
      negate: true
      value: HTTP/2 HTTP/2.0 HTTP/3 HTTP/3.0
    transformations:
    - none
    variables:
    - name: REQUEST_PROTOCOL
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}
    operator:
      name: strEq
      value: POST
    variables:
    - name: REQUEST_METHOD
  metadata:
    comment: |+
      Require Content-Length or Transfer-Encoding to be provided with
      every POST request if the protocol version is not HTTP/2 or HTTP/3.

      In case of HTTP/2, see the RFC7540 8.1 p52:
      HTTP/2 does not use the Transfer-Encoding: chunked anymore, because
      the underlying transport protocol is already using data frames with
      known length.

      In case of HTTP/3, see the RFC9114 4.1:
      Transfer codings (see Section 7 of [HTTP/1.1]) are not defined for
      HTTP/3; the Transfer-Encoding header field MUST NOT be used.

      -=[ Rule Logic ]=-
      This chained rule checks if the protocol is not HTTP/2 or HTTP/3,
      then checks request method is POST, if so, it checks that a
      Content-Length or Transfer-Encoding headers are also present.

    id: 920180
    message: POST without Content-Length and Transfer-Encoding headers
    phase: "1"
    severity: WARNING
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
  order: 920180
---
apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920181"
    seclang.kubewaf.io/order: "920181"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.210.272: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920181
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}
  match:
  - collections:
    - arguments:
      - Transfer-Encoding
      count: true
      name: REQUEST_HEADERS
    operator:
      name: eq
      negate: true
      value: "0"
    transformations:
    - none
  - collections:
    - arguments:
      - Content-Length
      count: true
      name: REQUEST_HEADERS
    operator:
      name: eq
      negate: true
      value: "0"
    transformations:
    - none
  metadata:
    comment: |+
      As per RFC7230 3.3.2: A sender MUST NOT send a Content-Length
      header field in any message that contains a Transfer-Encoding header
      field.

      Related to 920170, 920171 and 920180.

    id: 920181
    message: Content-Length and Transfer-Encoding headers present
    phase: "1"
    severity: WARNING
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
    - capec/1000/210/272
  order: 920181
