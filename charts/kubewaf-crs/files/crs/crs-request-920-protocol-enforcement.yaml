    seclang.kubewaf.io/tag.language-aspnet: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.3: "true"
    seclang.kubewaf.io/tag.platform-windows: "true"
  name: crs-920490
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'
  match:
  - collections:
    - arguments:
      - x-up-devcap-post-charset
      count: true
      name: REQUEST_HEADERS
    operator:
      name: ge
      value: "1"
    transformations:
    - none
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl3=+%{tx.critical_anomaly_score}
    collections:
    - arguments:
      - User-Agent
      name: REQUEST_HEADERS
    operator:
      name: rx
      value: ^(?i)up
    transformations:
