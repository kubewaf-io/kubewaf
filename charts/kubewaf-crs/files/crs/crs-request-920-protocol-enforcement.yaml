apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-920-PROTOCOL-ENFORCEMENT.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "920620"
    seclang.kubewaf.io/order: "920620"
    seclang.kubewaf.io/phase: "1"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-enforcement: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-920620
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: '%{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - arguments:
      - Content-Type
      count: true
      name: REQUEST_HEADERS
    operator:
      name: gt
      value: "1"
    transformations:
    - none
  metadata:
    comment: |+
      The following rule (920620) checks for the presence of 2 or more request Content-Type headers.
      Content-Type confusion poses a significant security risk to a web application. It occurs when
      the server and client have different interpretations of the Content-Type header, leading to
      miscommunication, potential exploitation and WAF bypass.

      Using Apache, when multiple Content-Type request headers are received, the server combines them
      into a single header with the values separated by commas. For example, if a client sends multiple
      Content-Type headers with values "application/json" and "text/plain", Apache will combine them
      into a single header like this: "Content-Type: application/json, text/plain".

      On the other hand, Nginx handles multiple Content-Type headers differently. It preserves each
      header as a separate entity without combining them. So, if a client sends multiple Content-Type
      headers, Nginx will keep them separate, maintaining the original values.

    id: 920620
    message: Multiple Content-Type Request Headers
    phase: "1"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS/PROTOCOL-ENFORCEMENT
  order: 920620
