    - name: MATCHED_VARS
    operator:
      name: rx
      negate: true
      value: ^(?:ey[\-0-9A-Z_a-z]+\.ey[\-0-9A-Z_a-z]+\.)?[\-0-9A-Z_a-z]+$
    transformations:
    - none
