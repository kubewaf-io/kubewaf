kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-942-APPLICATION-ATTACK-SQLI.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "942160"
    seclang.kubewaf.io/order: "942160"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-sqli: "true"
    seclang.kubewaf.io/tag.capec.1000.152.248.66: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-sqli: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-942160
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.sql_injection_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - name: ARGS_NAMES
    - name: ARGS
    - arguments:
      - /*
      name: XML
    operator:
      name: rx
      value: (?i:sleep\s*?\(.*?\)|benchmark\s*?\(.*?\,.*?\))
    transformations:
    - none
    - urlDecodeUni
    - replaceComments
    variables:
    - name: REQUEST_FILENAME
  metadata:
    comment: |+
      -=[ PHPIDS - Converted SQLI Filters ]=-

      https://raw.githubusercontent.com/PHPIDS/PHPIDS/master/lib/IDS/default_filter.xml

      The rule 942160 prevents time-based blind SQL injection attempts
      by prohibiting sleep() or benchmark(,) functions:

      * The sleep command takes a number of seconds as an argument.
      * The benchmark command executes the specified expression multiple times.

      Using a long sleep time or high number of executions, you can create a delay
      with the response from the server.  This allows to determine whether the
      query has been executed or not.  A high response time proves that the SQLi
      worked successfully. It can now be equipped with the real payload.

      Therefore this rule does not prevent the attack itself, but blocks an
      attacker from using the standard utils to tinker with blind SQLi.

      A positive side effect is that it prevents certain DoS attacks via the directives
      described above.

    id: 942160
    message: Detects blind sqli tests using sleep() or benchmark()
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-sqli
    - paranoia-level/1
    - OWASP_CRS/ATTACK-SQLI
    - capec/1000/152/248/66
  order: 942160
