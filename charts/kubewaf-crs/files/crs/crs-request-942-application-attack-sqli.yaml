apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-942-APPLICATION-ATTACK-SQLI.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "942510"
    seclang.kubewaf.io/order: "942510"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-sqli: "true"
    seclang.kubewaf.io/tag.capec.1000.152.248.66: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-sqli: "true"
    seclang.kubewaf.io/tag.paranoia-level.2: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-942510
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.sql_injection_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl2=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - name: ARGS_NAMES
    - name: ARGS
    - arguments:
      - /*
      name: XML
    operator:
      name: rx
      value: '`(?:[\s\x0b\(\)\+\-0-9<=@-Z_a-\{\}]{2,29}|(?:[\+/-9A-Za-z]{4})+(?:(?:[\+/-9A-Za-z]{2}=|[\+/-9A-Za-z]{3})=)?)`'
    transformations:
    - none
    - urlDecodeUni
  metadata:
    comment: |+
      -=[ Detect SQLi bypass: backticks ]=-

      Quotes and backticks can be used to bypass SQLi detection.

      Example:
      GET http://localhost/test.php?id=9999%20or+{`if`(2=(select+2+from+wp_users+where+user_login='admin'))}

      The minimum text between the ticks or backticks must be 2 (if, for example) and a maximum of 29.
      29 is a compromise: The lower this number (29), the lower the probability of FP and the higher the probability of false negatives.
      In tests we got a minimum number of FP with {2,29}.

      Base64 encoding detection:
      (?:[A-Za-z0-9+/]{4})+ #match any number of 4-letter blocks of the base64 char set
      (?:[A-Za-z0-9+/]{2}== #match 2-letter block of the base64 char set followed by "==", together forming a 4-letter block
      |                     # or
      [A-Za-z0-9+/]{3}=     #match 3-letter block of the base64 char set followed by "=", together forming a 4-letter block
      )?

      The minimal string that triggers this regexp is: `if`

      The rule 942511 is similar to this rule, but triggers on normal quotes
      ('if'). That rule runs in paranoia level 3 or higher since it is prone to
      false positives in natural text.

      Regular expression generated from regex-assembly/942510.ra.
      To update the regular expression run the following shell script
      (consult https://coreruleset.org/docs/development/regex_assembly/ for details):
        crs-toolchain regex update 942510

    id: 942510
    message: SQLi bypass attempt by ticks or backticks detected
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-sqli
    - paranoia-level/2
    - OWASP_CRS/ATTACK-SQLI
    - capec/1000/152/248/66
  order: 942510
