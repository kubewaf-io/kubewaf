    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-sqli: "true"
    seclang.kubewaf.io/tag.capec.1000.152.248.66: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-sqli: "true"
    seclang.kubewaf.io/tag.paranoia-level.2: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-942101
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.sql_injection_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl2=+%{tx.critical_anomaly_score}
  match:
  - operator:
      name: detectSQLi
    transformations:
    - none
    - utf8toUnicode
    - urlDecodeUni
    - removeNulls
    variables:
    - name: REQUEST_BASENAME
    - name: REQUEST_FILENAME
  metadata:
    comment: |+
      This is a sibling of rule 942100 that adds checking of the path.

      REQUEST_BASENAME provides the last url segment (slash excluded).
      This segment is the most likely to be used for injections. Stripping out
      the slash permits libinjection to do not consider it as a payload starting
      with not unary arithmetical operators (not a valid SQL command, e.g.
      '/9 union all'). The latter would lead to do not detect malicious payloads.

      REQUEST_FILENAME matches SQLi payloads inside (or across) other segments
      of the path. Here, libinjection will detect a true positive only if
      the url leading slash is considered as part of a comment block or part
      of a string (with a quote or double quote after it). In these circumstances,
      previous slashes do not affect libinjection result, making it able to detect
      some SQLi inside the path.

