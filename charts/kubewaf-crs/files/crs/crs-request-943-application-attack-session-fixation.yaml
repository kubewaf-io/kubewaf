    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-fixation: "true"
    seclang.kubewaf.io/tag.capec.1000.225.21.593.61: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-session-fixation: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-943110
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{TX.943110_MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.943110_matched_var_name=%{matched_var_name}
  match:
  - collections:
    - name: ARGS_NAMES
    operator:
      name: rx
      value: ^(?:j(?:se(?:ssionid|rvsession)|wsession)|(?:asp(?:\.net_)?session|zend_session_)id|p(?:hpsessi(?:on|d)|lay_session)|(?:(?:w(?:eblogic|l)|rack\.|laravel_)sessio|(?:next-auth\.session-|meteor_login_)toke)n|s(?:(?:ession[\-_]?|ails\.s)id|hiny-token)|_(?:session_id|(?:(?:flask|rails)_sessio|_(?:secure|host)-next-auth\.session-toke)n)|c(?:f(?:s?id|token)|onnect\.sid|akephp|i_session)|koa[\.:]sess)$
    transformations:
    - none
    - lowercase
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: capture
    collections:
    - arguments:
      - Referer
      name: REQUEST_HEADERS
    operator:
