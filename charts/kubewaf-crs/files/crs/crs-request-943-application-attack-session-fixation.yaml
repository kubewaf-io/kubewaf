    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "943100"
    seclang.kubewaf.io/order: "943100"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-fixation: "true"
    seclang.kubewaf.io/tag.capec.1000.225.21.593.61: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-session-fixation: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-943100
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.session_fixation_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - name: ARGS_NAMES
    - name: ARGS
    - arguments:
      - /*
      name: XML
    operator:
      name: rx
      value: (?i)\.cookie\b.*?;[^0-9A-Z_a-z]*?(?:expires|domain)[^0-9A-Z_a-z]*?=|\bhttp-equiv[^0-9A-Z_a-z]+set-cookie\b
    transformations:
    - none
    - urlDecodeUni
  metadata:
    id: 943100
    message: 'Possible Session Fixation Attack: Setting Cookie Values in HTML'
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-fixation
    - paranoia-level/1
    - OWASP_CRS/ATTACK-SESSION-FIXATION
    - capec/1000/225/21/593/61
  order: 943100
