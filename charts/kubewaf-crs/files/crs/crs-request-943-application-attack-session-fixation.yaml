      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
    collections:
    - arguments:
      - "1"
      name: TX
    operator:
      name: endsWith
      negate: true
      value: '%{request_headers.host}'
  metadata:
    comment: |+
      Regular expression generated from regex-assembly/943110.ra.
