    message: 'Possible Session Fixation Attack: SessionID Parameter Name with Off-Domain
      Referer'
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-fixation
    - paranoia-level/1
    - OWASP_CRS/ATTACK-SESSION-FIXATION
    - capec/1000/225/21/593/61
  order: 943110
