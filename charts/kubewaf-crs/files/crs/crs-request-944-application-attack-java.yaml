    seclang.kubewaf.io/tag.owasp_crs.attack-java: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-944110
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'
  match:
  - collections:
    - name: ARGS
    - name: ARGS_NAMES
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - excludes:
      - Cookie
      name: REQUEST_HEADERS
    - arguments:
      - /*
      - //@*
      name: XML
    operator:
      name: rx
      value: (?:runtime|processbuilder)
    transformations:
    - none
    - lowercase
    variables:
    - name: REQUEST_BODY
  - actions:

      non-disruptive:
      - nonDisruptiveActionType: setvar
        value: TX.rce_score=+%{tx.critical_anomaly_score}
      - nonDisruptiveActionType: setvar
        value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
    collections:
    - name: MATCHED_VARS
    - arguments:
      - /*
      - //@*
      name: XML
    operator:
      name: rx
      value: (?i)(?:unmarshaller|base64data|java\.)
  metadata:
    comment: |
      This rule is also triggered by the following exploit(s):
      [ Apache Struts vulnerability CVE-2017-5638 - Exploit tested: https://github.com/xsscx/cve-2017-5638 ]
      [ Apache Struts vulnerability CVE-2017-9791 - Exploit tested: https://www.exploit-db.com/exploits/42324 ]
      [ Apache Struts vulnerability CVE-2017-9805 - Exploit tested: https://www.exploit-db.com/exploits/42627 ]
