apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-944-APPLICATION-ATTACK-JAVA.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "944140"
    seclang.kubewaf.io/order: "944140"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-injection-java: "true"
    seclang.kubewaf.io/tag.capec.1000.152.242: "true"
    seclang.kubewaf.io/tag.language-java: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-java: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-944140
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.rce_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: FILES
    - arguments:
      - X-Filename
      - X_Filename
      - X.Filename
      - X-File-Name
      name: REQUEST_HEADERS
    operator:
      name: rx
      value: .*\.(?:jsp|jspx)\.*$
    transformations:
    - none
    - lowercase
    - removeWhitespace
  metadata:
    comment: |+
      [ Java Script Uploads ]

      Block file uploads with filenames ending in Java scripts (.jsp, .jspx)

      Many application contain Unrestricted File Upload vulnerabilities.
      https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload

      Attackers may use such a vulnerability to achieve remote code execution
      by uploading a script file. If the upload storage location is predictable
      and not adequately protected, the attacker may then request the uploaded
      file and have the code within it executed on the server.

      Some AJAX uploaders use the nonstandard request headers X-Filename,
      X_Filename, or X-File-Name to transmit the file name to the server;
      scan these request headers as well as multipart/form-data file names.

    id: 944140
    message: 'Java Injection Attack: Java Script File Upload Found'
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-java
    - platform-multi
    - attack-injection-java
    - paranoia-level/1
    - OWASP_CRS/ATTACK-JAVA
    - capec/1000/152/242
  order: 944140
---
apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-944-APPLICATION-ATTACK-JAVA.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "944150"
    seclang.kubewaf.io/order: "944150"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-rce: "true"
    seclang.kubewaf.io/tag.capec.1000.152.137.6: "true"
    seclang.kubewaf.io/tag.language-java: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-java: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-944150
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: log
    - nonDisruptiveActionType: setvar
      value: TX.rce_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: ARGS
    - name: ARGS_NAMES
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - excludes:
      - Cookie
      name: REQUEST_HEADERS
    - arguments:
      - /*
      - //@*
      name: XML
    operator:
      name: rx
      value: (?i)(?:\$|&dollar;?)(?:\{|&l(?:brace|cub);?)(?:[^\}]{0,15}(?:\$|&dollar;?)(?:\{|&l(?:brace|cub);?)|jndi|ctx)
    transformations:
    - none
    - urlDecodeUni
    - jsDecode
    - htmlEntityDecode
    variables:
    - name: REQUEST_LINE
  metadata:
    comment: |+
      Log4J / Log4Shell Defense

      This addresses exploits against the Log4J library described in several CVEs:
      * CVE-2021-44228
      * CVE-2021-44832
      * CVE-2021-45046
      * CVE-2021-45105

      See https://coreruleset.org/20211213/crs-and-log4j-log4shell-cve-2021-44228/

      This rule attempts to detect two things:
      * Nested use of ${
      * use of ${jndi:... without the closing bracket

      Rule 932130 is also essential for defense since there are certain
      bypasses of the log4j rules that can be caught by 932130.

      The payload is not displayed in the alert message since log4j could
      potentially be executed on the logviewer.

      This rule has stricter siblings: 944151 (PL2), 944152 (PL4)

      Regular expression generated from regex-assembly/944150.ra.
      To update the regular expression run the following shell script
      (consult https://coreruleset.org/docs/development/regex_assembly/ for details):
        crs-toolchain regex update 944150

    id: 944150
    message: 'Potential Remote Command Execution: Log4j / Log4shell'
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-java
    - platform-multi
    - attack-rce
    - paranoia-level/1
    - OWASP_CRS/ATTACK-JAVA
    - capec/1000/152/137/6
  order: 944150
---
