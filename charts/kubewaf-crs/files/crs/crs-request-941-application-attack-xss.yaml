    seclang.kubewaf.io/tag.capec.1000.152.242.63: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-xss: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.xss-perf-disable: "true"
  name: crs-941360
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: Suspicious payload found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.xss_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - name: ARGS_NAMES
    - name: ARGS
    - arguments:
      - /*
      name: XML
    operator:
      name: rx
      value: '![!+ ]\[\]'
    transformations:
    - none
    variables:
    - name: REQUEST_FILENAME
  metadata:
    comment: |
      Defend against JSFuck and Hieroglyphy obfuscation of Javascript code

      https://en.wikipedia.org/wiki/JSFuck
      https://github.com/alcuadrado/hieroglyphy

      These JS obfuscations mostly aim for client side XSS exploits, hence the
      integration of this rule into the XSS rule group. But serverside JS could
      also be attacked via these techniques.

      Detection pattern / Core elements of JSFuck and Hieroglyphy are the
      following two items:
      !![]
      !+[]

      ModSecurity always transforms "+" into " " with query strings and the
      URLENCODE body processor (but not for JSON). So we need to check for
      the following patterns:
      !![]
      !+[]
      ! []
    id: 941360
