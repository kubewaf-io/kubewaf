apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-941-APPLICATION-ATTACK-XSS.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "941120"
    seclang.kubewaf.io/order: "941120"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-xss: "true"
    seclang.kubewaf.io/tag.capec.1000.152.242: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-xss: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
    seclang.kubewaf.io/tag.xss-perf-disable: "true"
  name: crs-941120
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.xss_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - excludes:
      - Cookie
      name: REQUEST_HEADERS
    - name: ARGS_NAMES
    - name: ARGS
    - arguments:
      - /*
      name: XML
    operator:
      name: rx
      value: (?i)[\t-\r \"'\(,/-9;=`]on[a-z]{3,50}[\t-\r \(,;]*?=[^=]
    transformations:
    - none
    - utf8toUnicode
    - urlDecodeUni
    - htmlEntityDecode
    - jsDecode
    - cssDecode
    - removeNulls
    variables:
    - name: REQUEST_FILENAME
  metadata:
    comment: |+
      -=[ XSS Filters - Category 2 ]=-
      XSS vectors making use of event handlers like onerror, onload etc, e.g., <body onload="alert(1)">

      We are not listing all the known event handlers like rule 941160, but we
      limit the alerts to keywords of 3-50 characters after the prefix ("on").

      The shortest known event is "onget". The longest known event is "onwebkitplaybacktargetavailabilitychanged"
      with 39 chars after the prefix. 50 chars adds a little bit of safety.

      The regex requires the equals sign to be followed by a non-equals character (=[^=])
      to prevent false positives with base64-encoded strings (which often end in = or ==).
      This improvement allows the rule to be placed at PL1 despite having previously been
      moved to PL2 in v3.4 due to base64-related false positives with the older regex.

      Regular expression generated from regex-assembly/941120.ra.
      To update the regular expression run the following shell script
      (consult https://coreruleset.org/docs/development/regex_assembly/ for details):
        crs-toolchain regex update 941120

    id: 941120
    message: 'XSS Filter - Category 2: Event Handler Vector'
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-xss
    - xss-perf-disable
    - paranoia-level/1
    - OWASP_CRS/ATTACK-XSS
    - capec/1000/152/242
  order: 941120
---
