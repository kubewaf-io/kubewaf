apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-941-APPLICATION-ATTACK-XSS.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "941100"
    seclang.kubewaf.io/order: "941100"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-xss: "true"
    seclang.kubewaf.io/tag.capec.1000.152.242: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.attack-xss: "true"
    seclang.kubewaf.io/tag.paranoia-level.1: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
    seclang.kubewaf.io/tag.xss-perf-disable: "true"
  name: crs-941100
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: XSS data found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.xss_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: REQUEST_COOKIES
    - name: REQUEST_COOKIES_NAMES
    - arguments:
      - User-Agent
      name: REQUEST_HEADERS
    - name: ARGS_NAMES
    - name: ARGS
    - arguments:
      - /*
      name: XML
    operator:
      name: detectXSS
    transformations:
    - none
    - utf8toUnicode
    - urlDecodeUni
    - htmlEntityDecode
    - jsDecode
    - cssDecode
    - removeNulls
  metadata:
    comment: |+
      -=[ Libinjection - XSS Detection ]=-

      Ref: https://github.com/client9/libinjection
      Ref: https://speakerdeck.com/ngalbreath/libinjection-from-sqli-to-xss

      -=[ Targets ]=-

      941100: PL1 : REQUEST_COOKIES|
                    REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent|
                    ARGS_NAMES|ARGS|XML:/*

      941101: PL2 : REQUEST_FILENAME|REQUEST_HEADERS:Referer

    id: 941100
    message: XSS Attack Detected via libinjection
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-xss
    - xss-perf-disable
    - paranoia-level/1
    - OWASP_CRS/ATTACK-XSS
    - capec/1000/152/242
  order: 941100
