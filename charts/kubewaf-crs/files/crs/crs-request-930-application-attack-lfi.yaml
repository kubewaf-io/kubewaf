  - collections:
    - name: ARGS
    - excludes:
      - Referer
      name: REQUEST_HEADERS
    - name: FILES
    - arguments:
      - /*
      name: XML
    operator:
      name: rx
      value: (?:^|[/;\x5c])\.{2,3}[/;\x5c]
