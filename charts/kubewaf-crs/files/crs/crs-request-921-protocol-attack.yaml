kind: SecRule
metadata:
  labels:
    app.kubernetes.io/part-of: coreruleset
    coreruleset/file: REQUEST-921-PROTOCOL-ATTACK.conf
    coreruleset/version: 4.27.0
    seclang.kubewaf.io/id: "921210"
    seclang.kubewaf.io/order: "921210"
    seclang.kubewaf.io/phase: "2"
    seclang.kubewaf.io/tag.application-multi: "true"
    seclang.kubewaf.io/tag.attack-protocol: "true"
    seclang.kubewaf.io/tag.capec.1000.152.137.15.460: "true"
    seclang.kubewaf.io/tag.language-multi: "true"
    seclang.kubewaf.io/tag.owasp_crs.protocol-attack: "true"
    seclang.kubewaf.io/tag.paranoia-level.3: "true"
    seclang.kubewaf.io/tag.platform-multi: "true"
  name: crs-921210
spec:
  actions:
    disruptive:
      disruptiveActionType: block
    non-disruptive:
    - nonDisruptiveActionType: capture
    - nonDisruptiveActionType: log
    - nonDisruptiveActionType: logdata
      value: 'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}'
    - nonDisruptiveActionType: setvar
      value: TX.http_violation_score=+%{tx.critical_anomaly_score}
    - nonDisruptiveActionType: setvar
      value: TX.inbound_anomaly_score_pl3=+%{tx.critical_anomaly_score}
  match:
  - collections:
    - name: ARGS_NAMES
    operator:
      name: rx
      value: (][^\]]+$|][^\]]+\[)
  metadata:
    comment: |+
      -=[ HTTP Parameter Pollution ]=-

      [ Rule Logic ]
      Parameter pollution rule 921180 PL3 can by bypassed when a weak backend parameter
      parser is ignoring additional characters in a parameter array name after the
      closing of the array.
      Rule 921210 PL3 prevents this by disallowing arbitrary strings after an array has
      been closed or inbetween the square brackets in multidimensional arrays.
      Please note that rule 921210 allows for 2-dimensional, but not for higher dimensional
      arrays. If these are flagged as attacks, a rule exclusion will have to be
      deployed; ideally for the parameter(s) in question.

      [ References ]
      Private bug bounty in Spring 2022, findings Z05OZUCH.

      [ Payloads ]
      * foo[1]a=bar&foo[1]b=<evil> - parameter parsers often cut after the closing of
        the array. 921180 PL3 takes the full name, though.
        This impediance mismatch allows for bypasses.
      * foo[1]x[1]=bar&foo[1]x[2]=<evil> - extension of 1; this has the advantage that
        the parameter name does end with "]" just like a valid array notation.

    id: 921210
    message: HTTP Parameter Pollution after detecting bogus char after parameter array
    phase: "2"
    severity: CRITICAL
    tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/3
    - OWASP_CRS/PROTOCOL-ATTACK
    - capec/1000/152/137/15/460
  order: 921210
