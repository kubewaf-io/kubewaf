{{- /*
Optimized RuleSet profiles that select CRS SecRules by coreruleset/* labels.
Attach to a Path B WAF via ruleRefs (crsEnable: false).
*/ -}}
{{- $crsVersion := (.Values.crs.version | default "4.27.0") }}
{{- $labels := include "kubewaf-crs.labels" . }}
{{- $profiles := .Values.profiles | default dict }}

{{- if and $profiles.core $profiles.core.enabled }}
---
apiVersion: waf.kubewaf.io/v1beta1
kind: RuleSet
metadata:
  name: crs-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    waf.kubewaf.io/profile: core
    waf.kubewaf.io/optimized: "true"
spec:
  allowedRules:
    from: Same
  ruleRefs:
    - kind: SecRule
      group: seclang.kubewaf.io
      version: v1beta1
      selector:
        matchLabels:
          coreruleset/version: {{ $crsVersion | quote }}
        matchExpressions:
          - key: coreruleset/file
            operator: In
            values:
              - REQUEST-901-INITIALIZATION.conf
              - REQUEST-905-COMMON-EXCEPTIONS.conf
              - REQUEST-911-METHOD-ENFORCEMENT.conf
              - REQUEST-913-SCANNER-DETECTION.conf
              - REQUEST-920-PROTOCOL-ENFORCEMENT.conf
              - REQUEST-921-PROTOCOL-ATTACK.conf
              - REQUEST-949-BLOCKING-EVALUATION.conf
              - RESPONSE-959-BLOCKING-EVALUATION.conf
              - RESPONSE-980-CORRELATION.conf
{{- end }}

