{{- if .Values.webhooks.enabled }}
{{- $fullName := include "kubewaf.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $svcName := printf "%s-webhook" $fullName }}
{{- $dns := printf "%s.%s.svc" $svcName $ns }}
{{- $dnsCluster := printf "%s.%s.svc.cluster.local" $svcName $ns }}
{{- $ca := genCA (printf "%s-webhook-ca" $fullName) 3650 }}
{{- $cert := genSignedCert $dns nil (list $dns $dnsCluster "localhost") 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-webhook-certs
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: 443
      targetPort: webhook
  selector:
    {{- include "kubewaf.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullName }}-validating
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
webhooks:
  {{- range $hook := list
      (dict "name" "v1a1secrule.kubewaf.io" "path" "/validate-seclang-kubewaf-io-v1alpha1-secrule" "resource" "secrules" "group" "seclang.kubewaf.io")
      (dict "name" "v1a1secaction.kubewaf.io" "path" "/validate-seclang-kubewaf-io-v1alpha1-secaction" "resource" "secactions" "group" "seclang.kubewaf.io")
      (dict "name" "v1a1include.kubewaf.io" "path" "/validate-seclang-kubewaf-io-v1alpha1-include" "resource" "includes" "group" "seclang.kubewaf.io")
      (dict "name" "v1a1secpolicy.kubewaf.io" "path" "/validate-seclang-kubewaf-io-v1alpha1-secpolicy" "resource" "secpolicies" "group" "seclang.kubewaf.io")
      (dict "name" "v1a1protection.kubewaf.io" "path" "/validate-waf-kubewaf-io-v1alpha1-protection" "resource" "protections" "group" "waf.kubewaf.io") }}
  - name: {{ $hook.name }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 30
    failurePolicy: {{ $.Values.webhooks.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: {{ $hook.path }}
      caBundle: {{ $ca.Cert | b64enc }}
    rules:
      - apiGroups: ["{{ $hook.group }}"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $hook.resource }}"]
        scope: Namespaced
  {{- end }}
{{- end }}
