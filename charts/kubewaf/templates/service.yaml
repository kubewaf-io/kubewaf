{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubewaf.fullname" . }}-metrics
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    {{- include "kubewaf.selectorLabels" . | nindent 4 }}
{{- end }}
