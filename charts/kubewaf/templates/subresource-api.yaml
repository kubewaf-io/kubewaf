{{- /*
  Subresource API Server (probes, directives, query). Probes require Test Server.
  Directives + query may run without probeTestServer.
*/ -}}
{{- $probesOn := and .Values.subresourceApi.enabled (dig "probes" "enabled" true .Values.subresourceApi) }}
{{- if and $probesOn (not .Values.probeTestServer.enabled) }}
{{- fail "probeTestServer.enabled must be true when subresourceApi.probes.enabled is true" }}
{{- end }}

{{- $apiOn := .Values.subresourceApi.enabled }}
{{- $tsOn := or .Values.probeTestServer.enabled $probesOn }}
{{- $directivesOn := and $apiOn (dig "directives" "enabled" true .Values.subresourceApi) }}
{{- $queryOn := and $apiOn (dig "query" "enabled" true .Values.subresourceApi) }}
{{- $fullName := include "helm.fullname" . }}
{{- $ns := .Release.Namespace }}

{{- /* Shared eval token Secret (both Deployments when either enabled) */ -}}
{{- if or $apiOn $tsOn }}
{{- $tokenSecretName := default (printf "%s-probe-eval-token" $fullName) .Values.subresourceApi.testServer.tokenSecretName }}
{{- if .Values.probeTestServer.auth.tokenSecretName }}
{{- $tokenSecretName = .Values.probeTestServer.auth.tokenSecretName }}
{{- end }}
{{- $tokenValue := "" -}}
{{- $existingTok := lookup "v1" "Secret" $ns $tokenSecretName -}}
{{- if and $existingTok $existingTok.data }}
  {{- $tokenValue = index $existingTok.data "token" -}}
{{- else }}
  {{- $tokenValue = randAlphaNum 48 | b64enc -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokenSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe-eval-token
type: Opaque
data:
  token: {{ $tokenValue }}
{{- end }}

{{- if $apiOn }}
{{- $apiSvcName := printf "%s-subresource-api" $fullName }}
{{- $apiDns := printf "%s.%s.svc" $apiSvcName $ns }}
{{- $apiDnsCluster := printf "%s.%s.svc.cluster.local" $apiSvcName $ns }}
{{- $certSecretName := printf "%s-subresource-api-certs" $fullName }}
{{- $caCert := "" -}}
{{- $tlsCrt := "" -}}
{{- $tlsKey := "" -}}
{{- $existingCert := lookup "v1" "Secret" $ns $certSecretName -}}
{{- if and $existingCert $existingCert.data }}
  {{- $caCert = index $existingCert.data "ca.crt" -}}
  {{- $tlsCrt = index $existingCert.data "tls.crt" -}}
  {{- $tlsKey = index $existingCert.data "tls.key" -}}
{{- else }}
  {{- $ca := genCA (printf "%s-subresource-api-ca" $fullName) 3650 -}}
  {{- $cert := genSignedCert $apiDns nil (list $apiDns $apiDnsCluster "localhost") 3650 $ca -}}
  {{- $caCert = $ca.Cert | b64enc -}}
  {{- $tlsCrt = $cert.Cert | b64enc -}}
  {{- $tlsKey = $cert.Key | b64enc -}}
{{- end }}
{{- $tokenSecretName := default (printf "%s-probe-eval-token" $fullName) .Values.subresourceApi.testServer.tokenSecretName }}
{{- $tsSvcName := printf "%s-probe-test-server" $fullName }}
{{- $tsPort := .Values.probeTestServer.service.port | default 8080 }}
{{- $testServerURL := .Values.subresourceApi.testServer.url }}
{{- if not $testServerURL }}
{{- $testServerURL = printf "http://%s.%s.svc:%v" $tsSvcName $ns $tsPort }}
{{- end }}
{{- $apiRegistry := default .Values.image.registry .Values.subresourceApi.image.registry }}
{{- $apiRepo := .Values.subresourceApi.image.repository }}
{{- $apiTag := default (default .Chart.AppVersion .Values.image.tag) .Values.subresourceApi.image.tag }}
{{- $apiPull := default .Values.image.pullPolicy .Values.subresourceApi.image.pullPolicy }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $certSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert }}
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-subresource-api
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-subresource-api
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules", "phraselists", "iplists", "secactions"]
    verbs: ["get", "list"]
  - apiGroups: ["waf.kubewaf.io"]
    resources: ["rulesets", "wafs"]
    verbs: ["get", "list"]
  # PhraseList/IPList bodies and the managed observability ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-subresource-api
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-subresource-api
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}-subresource-api
    namespace: {{ $ns }}
---
# Copy requestheader client CA from kube-system into a namespaced Secret (two-CA model).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-subresource-api-rhca
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-subresource-api-rhca
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["extension-apiserver-authentication"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-subresource-api-rhca
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-subresource-api-rhca
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}-subresource-api-rhca
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-subresource-api-rhca
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-subresource-api-rhca
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-subresource-api-rhca
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}-subresource-api-rhca
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-subresource-api-rhca
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.global.jobs.kubectl.ttlSecondsAfterFinished | default 60 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "helm.name" . }}-subresource-api-rhca
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: subresource-api
    spec:
      restartPolicy: {{ .Values.global.jobs.kubectl.restartPolicy | default "Never" }}
      serviceAccountName: {{ $fullName }}-subresource-api-rhca
      containers:
        - name: copy-requestheader-ca
          image: "{{ .Values.global.jobs.kubectl.image.registry }}/{{ .Values.global.jobs.kubectl.image.repository }}:{{ .Values.global.jobs.kubectl.image.tag | default (include "helm.jobsTagKubeVersion" .) }}"
          imagePullPolicy: {{ .Values.global.jobs.kubectl.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              CM_NS=kube-system
              CM_NAME=extension-apiserver-authentication
              KEY=requestheader-client-ca-file
              OUT_SECRET={{ printf "%s-requestheader-ca" $fullName }}
              OUT_NS={{ $ns }}
              PEM="$(kubectl -n "$CM_NS" get configmap "$CM_NAME" -o "jsonpath={.data['$KEY']}")"
              if [ -z "$PEM" ]; then
                echo "missing $KEY in $CM_NS/$CM_NAME" >&2
                exit 1
              fi
              kubectl -n "$OUT_NS" create secret generic "$OUT_SECRET" \
                --from-literal=ca.crt="$PEM" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "wrote $OUT_NS/$OUT_SECRET"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $apiSvcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
spec:
  ports:
    - name: https
      port: {{ .Values.subresourceApi.service.port | default 443 }}
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "helm.name" . }}-subresource-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: subresource-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-subresource-api
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
spec:
  replicas: {{ .Values.subresourceApi.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helm.name" . }}-subresource-api
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: subresource-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "helm.name" . }}-subresource-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: subresource-api
        {{- with .Values.subresourceApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.subresourceApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $fullName }}-subresource-api
      {{- if $.Values.podSecurityContext.enabled }}
      securityContext: {{- omit $.Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: subresource-api
          {{- if $.Values.securityContext.enabled }}
          securityContext: {{- omit $.Values.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ $apiRegistry | trimSuffix "/" }}/{{ $apiRepo }}:{{ $apiTag }}"
          imagePullPolicy: {{ $apiPull }}
          args:
            - --bind-address=:8443
            - --authentication=requestheader
            - --tls-cert-file=/var/subresource-api/tls/tls.crt
            - --tls-private-key-file=/var/subresource-api/tls/tls.key
            - --requestheader-client-ca-file=/var/subresource-api/requestheader-ca/ca.crt
            - --enable-probes={{ $probesOn }}
            - --enable-directives={{ $directivesOn }}
            - --enable-query={{ $queryOn }}
            {{- if $probesOn }}
            - --test-server-url={{ $testServerURL }}
            - --test-server-token-file=/var/subresource-api/eval-token/token
            {{- end }}
            {{- if and $queryOn .Values.observability.managed.enabled .Values.observability.managed.victoriaMetrics.enabled }}
            - --metrics-backend-url={{ include "kubewaf.metricsQueryURL" . }}
            {{- end }}
            {{- if and $queryOn .Values.observability.managed.enabled (or .Values.observability.managed.victoriaTraces.enabled .Values.observability.managed.victoriaTraces.endpoint) }}
            - --traces-backend-url={{ include "kubewaf.tracesQueryURL" . }}
            {{- end }}
            - --per-namespace-concurrency={{ .Values.subresourceApi.concurrency.perNamespace | default 4 }}
            - --global-max-in-flight={{ .Values.subresourceApi.concurrency.globalMaxInFlight | default 32 }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.subresourceApi.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /var/subresource-api/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /var/subresource-api/requestheader-ca
              readOnly: true
            {{- if $probesOn }}
            - name: eval-token
              mountPath: /var/subresource-api/eval-token
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: {{ $certSecretName }}
        - name: requestheader-ca
          secret:
            secretName: {{ $fullName }}-requestheader-ca
        {{- if $probesOn }}
        - name: eval-token
          secret:
            secretName: {{ $tokenSecretName }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.subresources.kubewaf.io
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: subresource-api
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  group: subresources.kubewaf.io
  # Low priority so unqualified names (ruleset, secrule, waf) resolve to CRD
  # groups (waf.kubewaf.io / seclang.kubewaf.io), not this aggregated group.
  groupPriorityMinimum: 100
  version: v1alpha1
  versionPriority: 15
  service:
    name: {{ $apiSvcName }}
    namespace: {{ $ns }}
    port: {{ .Values.subresourceApi.service.port | default 443 }}
  caBundle: {{ $caCert }}
{{- if .Values.subresourceApi.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-subresource-api
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helm.name" . }}-subresource-api
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: subresource-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # kube-apiserver (CIDRs vary; kind often permissive / no enforcement)
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    - {} # apiserver + DNS + Test Server; tighten per environment if needed
{{- end }}

{{- if $probesOn }}
# Optional ClusterRole for probe users (bind in namespaces as needed)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-probe
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
rules:
  - apiGroups: ["subresources.kubewaf.io"]
    resources: ["secrules/probes", "rulesets/probes", "wafs/probes"]
    verbs: ["get", "create", "update", "patch", "delete"]
{{- end }}
{{- if or $directivesOn $queryOn }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-query
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
rules:
  - apiGroups: ["subresources.kubewaf.io"]
    resources: ["wafs/directives", "wafs/metrics", "wafs/traces", "clustermetrics"]
    verbs: ["get"]
{{- end }}
# Namespaced Role for the API server SA.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-subresource-api
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kubewaf-managed-observability"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-subresource-api
  namespace: {{ $ns }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: subresource-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-subresource-api
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}-subresource-api
    namespace: {{ $ns }}
{{- end }}
