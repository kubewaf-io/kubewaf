{{- if and .Values.observability.managed.enabled .Values.observability.managed.victoriaTraces.enabled }}
{{- $name := printf "%s-victoria-traces" (include "helm.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: victoria-traces
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 10428
      targetPort: http
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: victoria-traces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: victoria-traces
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: victoria-traces
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: victoria-traces
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-traces
          image: "{{ .Values.observability.managed.victoriaTraces.image.registry }}/{{ .Values.observability.managed.victoriaTraces.image.repository }}:{{ .Values.observability.managed.victoriaTraces.image.tag }}"
          imagePullPolicy: {{ .Values.observability.managed.victoriaTraces.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --httpListenAddr=:10428
            - --storageDataPath=/victoria-traces-data
          ports:
            - name: http
              containerPort: 10428
          volumeMounts:
            - name: data
              mountPath: /victoria-traces-data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.observability.managed.victoriaTraces.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- if .Values.observability.managed.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: victoria-traces
spec:
  podSelector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: victoria-traces
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: otel-collector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "helm.name" . }}-subresource-api
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: subresource-api
        - podSelector:
            matchLabels:
              {{- include "helm.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: DoesNotExist
      ports:
        - protocol: TCP
          port: 10428
{{- end }}
{{- end }}
