apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubewaf.fullname" . }}-projection
  namespace: {{ .Values.proxyNamespace }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubewaf.name" . }}-projection
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubewaf.name" . }}-projection
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "kubewaf.fullname" . }}-projection
      containers:
        - name: projection
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --projection-agent
            - --proxy-namespace={{ .Values.proxyNamespace }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: seclang
              mountPath: /etc/kubewaf/seclang
              readOnly: true
      volumes:
        - name: seclang
          configMap:
            name: kubewaf-seclang
            optional: true
