apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubewaf.fullname" . }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
rules:
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules", "secactions", "includes"]
    verbs: ["get", "list", "watch"]
  # The finalizer is written with a full-object update. The apiserver authorizes
  # that against secpolicies, not the finalizers subresource.
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules/status", "secactions/status", "includes/status", "secpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secpolicies/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyextensionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyproxies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubewaf.fullname" . }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubewaf.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubewaf.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubewaf.fullname" . }}-leader-election
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubewaf.fullname" . }}-leader-election
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubewaf.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kubewaf.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubewaf.fullname" . }}
  namespace: {{ .Values.proxyNamespace }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubewaf.fullname" . }}
  namespace: {{ .Values.proxyNamespace }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubewaf.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubewaf.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubewaf.fullname" . }}-projection
  namespace: {{ .Values.proxyNamespace }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubewaf.fullname" . }}-projection
  namespace: {{ .Values.proxyNamespace }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubewaf.fullname" . }}-projection
  namespace: {{ .Values.proxyNamespace }}
  labels:
    {{- include "kubewaf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubewaf.fullname" . }}-projection
subjects:
  - kind: ServiceAccount
    name: {{ include "kubewaf.fullname" . }}-projection
    namespace: {{ .Values.proxyNamespace }}
