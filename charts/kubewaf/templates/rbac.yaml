---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helm.fullname" . }}-controller
  labels:
    {{- include "helm.labels" . | nindent 4 }}
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - "*"
# Cluster-wide ConfigMap read for PhraseList/IPList configMapRef / parts (app namespaces).
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - ""
  resources:
    - namespaces
  verbs:
    - "list"
    - "watch"
    - "get"
- apiGroups:
    - ""
  resources:
    - events
  verbs:
    - list
    - update
    - create
    - patch
- apiGroups:
  - "seclang.kubewaf.io"
  resources:
  - "secrules"
  - "secrules/status"
  - "secactions"
  - "secactions/status"
  - "secruleidpools"
  - "secruleidpools/status"
  - "phraselists"
  - "phraselists/status"
  - "phraselists/finalizers"
  - "iplists"
  - "iplists/status"
  - "iplists/finalizers"
  verbs:
  - "*"
- apiGroups:
  - "waf.kubewaf.io"
  resources:
  - "rulesets"
  - "rulesets/status"
  - "wafs"
  - "wafs/status"
  - "wafs/finalizers"
  verbs:
  - "*"
- apiGroups:
  - "networking.istio.io"
  resources:
  - "envoyfilters"
  verbs:
  - "*"
- apiGroups:
  - "cilium.io"
  resources:
  - "ciliumenvoyconfigs"
  verbs:
  - "*"
- apiGroups:
  - "gateway.networking.k8s.io"
  resources:
  - "gateways"
  - "gatewayclasses"
  - "httproutes"
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helm.fullname" . }}-controller
  labels:
    {{- include "helm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "helm.fullname" . }}-controller
subjects:
  - name: {{ include "helm.serviceAccountName" . }}
    kind: ServiceAccount
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helm.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "helm.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "helm.fullname" . }}
subjects:
  - name: {{ include "helm.serviceAccountName" . }}
    kind: ServiceAccount
    namespace: {{ .Release.Namespace | quote }}
