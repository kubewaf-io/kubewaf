---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: secrules.seclang.kubewaf.io
spec:
  group: seclang.kubewaf.io
  names:
    categories:
    - waf
    - security
    kind: SecRule
    listKind: SecRuleList
    plural: secrules
    shortNames:
    - sr
    singular: secrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.metadata.id
      name: ID
      type: integer
    - jsonPath: .spec.metadata.phase
      name: Phase
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecRule is one SecRule directive, or one chain of them, plus
          an optional SecMarker.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecRuleSpec is one logical SecRule.
            properties:
              chain:
                description: |-
                  Chain is one or more links. Link 0 is the SecRule. Later links are
                  emitted with the chain action on the previous link.
                items:
                  description: ChainLink is one SecRule line in a chain.
                  properties:
                    actions:
                      description: |-
                        Actions on link 0 may include one disruptive action.
                        Later links must leave Disruptive empty. The chain action is not set here.
                      properties:
                        data:
                          items:
                            properties:
                              type:
                                enum:
                                - status
                                - xmlns
                                type: string
                              value:
                                maxLength: 512
                                type: string
                            required:
                            - type
                            type: object
                            x-kubernetes-validations:
                            - message: status takes an HTTP code and xmlns takes prefix=url
                              rule: (self.type == 'status' && self.value.matches('^[1-5][0-9]{2}$'))
                                || (self.type == 'xmlns' && self.value.matches('^[^=]+=.+$'))
                          maxItems: 8
                          type: array
                        disruptive:
                          properties:
                            type:
                              enum:
                              - allow
                              - block
                              - deny
                              - drop
                              - pass
                              - pause
                              - proxy
                              - redirect
                              type: string
                            value:
                              description: |-
                                Value is the argument: allow:phase, allow:request, pause:<ms>,
                                proxy:<url>, redirect:<url>. Empty for deny, drop, block, pass.
                              maxLength: 2048
                              type: string
                          required:
                          - type
                          type: object
                          x-kubernetes-validations:
                          - message: disruptive action value does not match the action
                              type
                            rule: (self.type in ['deny','drop','block','pass'] &&
                              (!has(self.value) || size(self.value) == 0)) || (self.type
                              == 'allow' && (!has(self.value) || size(self.value)
                              == 0 || self.value == 'phase' || self.value == 'request'))
                              || (self.type == 'pause' && has(self.value) && self.value.matches('^[0-9]+$'))
                              || (self.type in ['proxy','redirect'] && has(self.value)
                              && size(self.value) > 0)
                        flow:
                          items:
                            properties:
                              type:
                                description: chain is rejected. skip and skipAfter
                                  are the accepted types.
                                enum:
                                - skip
                                - skipAfter
                                - chain
                                type: string
                              value:
                                maxLength: 64
                                type: string
                            required:
                            - type
                            - value
                            type: object
                            x-kubernetes-validations:
                            - message: skip takes a positive integer and skipAfter
                                takes a marker name
                              rule: (self.type == 'skip' && self.value.matches('^[1-9][0-9]*$'))
                                || (self.type == 'skipAfter' && self.value.matches('^[A-Za-z_][A-Za-z0-9_-]*$'))
                                || self.type == 'chain'
                          maxItems: 8
                          type: array
                        nonDisruptive:
                          items:
                            properties:
                              type:
                                enum:
                                - append
                                - prepend
                                - auditlog
                                - capture
                                - ctl
                                - deprecatevar
                                - exec
                                - expirevar
                                - initcol
                                - log
                                - logdata
                                - multiMatch
                                - noauditlog
                                - nolog
                                - sanitiseArg
                                - sanitizeArg
                                - sanitiseMatched
                                - sanitizeMatched
                                - sanitiseMatchedBytes
                                - sanitizeMatchedBytes
                                - sanitiseRequestHeader
                                - sanitizeRequestHeader
                                - sanitiseResponseHeader
                                - sanitizeResponseHeader
                                - setenv
                                - setrsc
                                - setsid
                                - setuid
                                - setvar
                                type: string
                              value:
                                maxLength: 2048
                                type: string
                            required:
                            - type
                            type: object
                          maxItems: 32
                          type: array
                      type: object
                      x-kubernetes-validations:
                      - message: chain is emitted from the chain list, not from a
                          flow action
                        rule: '!has(self.flow) || self.flow.all(f, f.type != ''chain'')'
                      - message: action value does not match the action type
                        rule: '!has(self.nonDisruptive) || self.nonDisruptive.all(a,
                          (a.type in [''auditlog'',''capture'',''log'',''multiMatch'',''noauditlog'',''nolog'',''sanitiseMatched'',''sanitizeMatched'']
                          && (!has(a.value) || size(a.value) == 0)) || a.type in [''sanitiseMatchedBytes'',''sanitizeMatchedBytes'']
                          || (a.type in [''append'',''prepend'',''ctl'',''deprecatevar'',''exec'',''expirevar'',''initcol'',''logdata'',''sanitiseArg'',''sanitizeArg'',''sanitiseRequestHeader'',''sanitizeRequestHeader'',''sanitiseResponseHeader'',''sanitizeResponseHeader'',''setenv'',''setrsc'',''setsid'',''setuid'',''setvar'']
                          && has(a.value) && size(a.value) > 0))'
                    operator:
                      properties:
                        name:
                          enum:
                          - beginsWith
                          - contains
                          - containsWord
                          - detectSQLi
                          - detectXSS
                          - endsWith
                          - eq
                          - fuzzyHash
                          - ge
                          - geoLookup
                          - gsbLookup
                          - gt
                          - inspectFile
                          - ipMatch
                          - ipMatchFromFile
                          - ipMatchF
                          - le
                          - lt
                          - pm
                          - pmFromFile
                          - pmf
                          - rbl
                          - rsub
                          - rx
                          - rxGlobal
                          - streq
                          - strEq
                          - strmatch
                          - strMatch
                          - unconditionalMatch
                          - validateByteRange
                          - validateDTD
                          - validateHash
                          - validateSchema
                          - validateUrlEncoding
                          - validateUtf8Encoding
                          - verifyCC
                          - verifyCPF
                          - verifySSN
                          - verifySVNR
                          - within
                          type: string
                        negate:
                          description: Negate emits !@name.
                          type: boolean
                        value:
                          maxLength: 4096
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: operator value is required or forbidden based on
                          the operator
                        rule: (self.name in ['unconditionalMatch','detectSQLi','detectXSS','validateUrlEncoding','validateUtf8Encoding','geoLookup']
                          && (!has(self.value) || size(self.value) == 0)) || self.name
                          in ['verifyCPF','verifySSN','verifySVNR'] || (!(self.name
                          in ['unconditionalMatch','detectSQLi','detectXSS','validateUrlEncoding','validateUtf8Encoding','geoLookup','verifyCPF','verifySSN','verifySVNR'])
                          && has(self.value) && size(self.value) > 0)
                    targets:
                      items:
                        description: |-
                          Target is one SecLang variable or collection expression.
                          Emission: [!][&]NAME[:selector]
                        properties:
                          count:
                            type: boolean
                          exclude:
                            type: boolean
                          name:
                            enum:
                            - ARGS_COMBINED_SIZE
                            - AUTH_TYPE
                            - DURATION
                            - FILES_COMBINED_SIZE
                            - FILES_NAMES
                            - FILES_SIZES
                            - FILES_TMP_CONTENT
                            - FILES_TMPNAMES
                            - FULL_REQUEST
                            - FULL_REQUEST_LENGTH
                            - HIGHEST_SEVERITY
                            - INBOUND_DATA_ERROR
                            - MATCHED_VAR
                            - MATCHED_VAR_NAME
                            - MODSEC_BUILD
                            - MSC_PCRE_ERROR
                            - MSC_PCRE_LIMITS_EXCEEDED
                            - MULTIPART_BOUNDARY_QUOTED
                            - MULTIPART_BOUNDARY_WHITESPACE
                            - MULTIPART_CRLF_LF_LINES
                            - MULTIPART_DATA_AFTER
                            - MULTIPART_DATA_BEFORE
                            - MULTIPART_FILE_LIMIT_EXCEEDED
                            - MULTIPART_FILENAME
                            - MULTIPART_HEADER_FOLDING
                            - MULTIPART_INVALID_HEADER_FOLDING
                            - MULTIPART_INVALID_PART
                            - MULTIPART_INVALID_QUOTING
                            - MULTIPART_LF_LINE
                            - MULTIPART_MISSING_SEMICOLON
                            - MULTIPART_NAME
                            - MULTIPART_SEMICOLON_MISSING
                            - MULTIPART_STRICT_ERROR
                            - MULTIPART_UNMATCHED_BOUNDARY
                            - OUTBOUND_DATA_ERROR
                            - PATH_INFO
                            - PERF_ALL
                            - PERF_COMBINED
                            - PERF_GC
                            - PERF_LOGGING
                            - PERF_PHASE1
                            - PERF_PHASE2
                            - PERF_PHASE3
                            - PERF_PHASE4
                            - PERF_PHASE5
                            - PERF_SREAD
                            - PERF_SWRITE
                            - QUERY_STRING
                            - REMOTE_ADDR
                            - REMOTE_HOST
                            - REMOTE_PORT
                            - REMOTE_USER
                            - REQBODY_ERROR
                            - REQBODY_ERROR_MSG
                            - REQBODY_PROCESSOR
                            - REQBODY_PROCESSOR_ERROR
                            - REQBODY_PROCESSOR_ERROR_MSG
                            - REQUEST_BASENAME
                            - REQUEST_BODY
                            - REQUEST_BODY_LENGTH
                            - REQUEST_FILENAME
                            - REQUEST_LINE
                            - REQUEST_METHOD
                            - REQUEST_PROTOCOL
                            - REQUEST_URI
                            - REQUEST_URI_RAW
                            - RESPONSE_BODY
                            - RESPONSE_CONTENT_LENGTH
                            - RESPONSE_CONTENT_TYPE
                            - RESPONSE_PROTOCOL
                            - RESPONSE_STATUS
                            - SCRIPT_BASENAME
                            - SCRIPT_FILENAME
                            - SCRIPT_GID
                            - SCRIPT_GROUPNAME
                            - SCRIPT_MODE
                            - SCRIPT_UID
                            - SCRIPT_USERNAME
                            - SDBM_DELETE_ERROR
                            - SERVER_ADDR
                            - SERVER_NAME
                            - SERVER_PORT
                            - SESSIONID
                            - STATUS
                            - STATUS_LINE
                            - STREAM_INPUT_BODY
                            - STREAM_OUTPUT_BODY
                            - TIME
                            - TIME_DAY
                            - TIME_EPOCH
                            - TIME_HOUR
                            - TIME_MIN
                            - TIME_MON
                            - TIME_SEC
                            - TIME_WDAY
                            - TIME_YEAR
                            - UNIQUE_ID
                            - URLENCODED_ERROR
                            - USERAGENT_IP
                            - USERID
                            - WEBAPPID
                            - WEBSERVER_ERROR_LOG
                            - ARGS
                            - ARGS_GET
                            - ARGS_GET_NAMES
                            - ARGS_NAMES
                            - ARGS_POST
                            - ARGS_POST_NAMES
                            - ENV
                            - FILES
                            - GEO
                            - GLOBAL
                            - IP
                            - MATCHED_VARS
                            - MATCHED_VARS_NAMES
                            - MULTIPART_PART_HEADERS
                            - PERF_RULES
                            - REQUEST_COOKIES
                            - REQUEST_COOKIES_NAMES
                            - REQUEST_HEADERS
                            - REQUEST_HEADERS_NAMES
                            - RESOURCE
                            - RESPONSE_HEADERS
                            - RESPONSE_HEADERS_NAMES
                            - RULE
                            - SESSION
                            - TX
                            - USER
                            - XML
                            type: string
                          selector:
                            type: string
                        required:
                        - name
                        type: object
                      maxItems: 32
                      minItems: 1
                      type: array
                    transformations:
                      items:
                        enum:
                        - base64Decode
                        - base64DecodeExt
                        - base64Encode
                        - cmdLine
                        - compressWhitespace
                        - cssDecode
                        - escapeSeqDecode
                        - hexDecode
                        - hexEncode
                        - htmlEntityDecode
                        - jsDecode
                        - length
                        - lowercase
                        - md5
                        - none
                        - normalisePath
                        - normalizePath
                        - normalisePathWin
                        - normalizePathWin
                        - parityEven7bit
                        - parityOdd7bit
                        - parityZero7bit
                        - removeComments
                        - removeCommentsChar
                        - removeNulls
                        - removeWhitespace
                        - replaceComments
                        - replaceNulls
                        - sha1
                        - sqlHexDecode
                        - trim
                        - trimLeft
                        - trimRight
                        - uppercase
                        - urlDecode
                        - urlDecodeUni
                        - urlEncode
                        - utf8toUnicode
                        type: string
                      maxItems: 16
                      type: array
                  required:
                  - operator
                  - targets
                  type: object
                maxItems: 16
                minItems: 1
                type: array
              markerAfter:
                description: MarkerAfter emits a SecMarker line after this rule. skipAfter
                  targets it.
                maxLength: 64
                pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                type: string
              metadata:
                description: Metadata is the SecLang metadata actions. id and phase
                  are required.
                properties:
                  accuracy:
                    type: string
                  id:
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  maturity:
                    type: string
                  message:
                    maxLength: 2048
                    type: string
                  phase:
                    description: |-
                      Phase is 1 request headers, 2 request body, 3 response headers,
                      4 response body, 5 logging.
                    maximum: 5
                    minimum: 1
                    type: integer
                  revision:
                    type: string
                  severity:
                    pattern: ^([0-7]|EMERGENCY|ALERT|CRITICAL|ERROR|WARNING|NOTICE|INFO|DEBUG)$
                    type: string
                  tags:
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  version:
                    type: string
                required:
                - id
                - phase
                type: object
              order:
                default: 1000
                description: |-
                  Order is the sort key inside a SecPolicy. Lower runs first.
                  Ties break by object name. Zero is a real value.
                format: int32
                type: integer
              placement:
                default: AfterCRS
                description: |-
                  Placement selects which file the policy writes this rule into.
                  BeforeCRS is for setup overrides. AfterCRS is the default and is where custom detections belong.
                enum:
                - BeforeCRS
                - AfterCRS
                type: string
            required:
            - chain
            - metadata
            type: object
            x-kubernetes-validations:
            - message: only the first chain link may set a disruptive action
              rule: (size(self.chain) < 2 || !has(self.chain[1].actions) || !has(self.chain[1].actions.disruptive))
                && (size(self.chain) < 3 || !has(self.chain[2].actions) || !has(self.chain[2].actions.disruptive))
                && (size(self.chain) < 4 || !has(self.chain[3].actions) || !has(self.chain[3].actions.disruptive))
                && (size(self.chain) < 5 || !has(self.chain[4].actions) || !has(self.chain[4].actions.disruptive))
                && (size(self.chain) < 6 || !has(self.chain[5].actions) || !has(self.chain[5].actions.disruptive))
                && (size(self.chain) < 7 || !has(self.chain[6].actions) || !has(self.chain[6].actions.disruptive))
                && (size(self.chain) < 8 || !has(self.chain[7].actions) || !has(self.chain[7].actions.disruptive))
                && (size(self.chain) < 9 || !has(self.chain[8].actions) || !has(self.chain[8].actions.disruptive))
                && (size(self.chain) < 10 || !has(self.chain[9].actions) || !has(self.chain[9].actions.disruptive))
                && (size(self.chain) < 11 || !has(self.chain[10].actions) || !has(self.chain[10].actions.disruptive))
                && (size(self.chain) < 12 || !has(self.chain[11].actions) || !has(self.chain[11].actions.disruptive))
                && (size(self.chain) < 13 || !has(self.chain[12].actions) || !has(self.chain[12].actions.disruptive))
                && (size(self.chain) < 14 || !has(self.chain[13].actions) || !has(self.chain[13].actions.disruptive))
                && (size(self.chain) < 15 || !has(self.chain[14].actions) || !has(self.chain[14].actions.disruptive))
                && (size(self.chain) < 16 || !has(self.chain[15].actions) || !has(self.chain[15].actions.disruptive))
            - message: exclude and count cannot both be set on one target
              rule: self.chain.all(l, l.targets.all(t, !(has(t.exclude) && t.exclude
                && has(t.count) && t.count)))
            - message: chain is emitted from the chain list, not from a flow action
              rule: self.chain.all(l, !has(l.actions) || !has(l.actions.flow) || l.actions.flow.all(f,
                f.type != 'chain'))
          status:
            description: SecLangStatus is the compiled text of one object.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              secLang:
                description: SecLang is the rendered directive text, including a trailing
                  SecMarker line.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
