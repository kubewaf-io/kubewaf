---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: rulesets.seclang.kubewaf.io
spec:
  group: seclang.kubewaf.io
  names:
    categories:
    - waf
    - security
    kind: RuleSet
    listKind: RuleSetList
    plural: rulesets
    shortNames:
    - rs
    singular: ruleset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RuleSet is an ordered list of rule references in one namespace.
          References compose: a base set, a java set that includes base, and a
          java-frontend set that includes java. Each hop is resolved on its own.
          A cross-namespace name requires a gateway.networking.k8s.io/v1 ReferenceGrant
          in the target namespace whose from matches this RuleSet. The operator does
          not install that CRD.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RuleSetSpec is the ordered reference list.
            properties:
              ruleRefs:
                description: RuleRefs are expanded in order. Selector matches are
                  ordered by name.
                items:
                  description: |-
                    ObjectRef is one ordered entry in RuleSet.spec.ruleRefs or SecPolicy.spec.ruleSetRefs.
                    Group and kind are an allow-list. There is no apiVersion or version.
                    Exactly one of name or selector is set.
                    A selector is evaluated only in the containing object's own namespace, so it
                    cannot set namespace and a ClusterRuleSet cannot use one.
                    Namespace on a named ref defaults to the referrer's namespace. It is required
                    when a ClusterRuleSet names a namespaced kind, and it must be empty for a
                    ClusterRuleSet target.
                  properties:
                    group:
                      enum:
                      - seclang.kubewaf.io
                      type: string
                    kind:
                      enum:
                      - RuleSet
                      - ClusterRuleSet
                      - SecRule
                      - SecAction
                      - Include
                      type: string
                    name:
                      description: Name and Selector are mutually exclusive.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: |-
                        Namespace is the target namespace for a named namespaced object.
                        Empty means the referrer's namespace. ClusterRuleSet targets leave it empty.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    selector:
                      description: Selector matches labels in the containing object's
                        namespace only.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - group
                  - kind
                  type: object
                maxItems: 64
                minItems: 1
                type: array
            required:
            - ruleRefs
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: each ruleRef sets name or selector, not both
          rule: self.spec.ruleRefs.all(r, (has(r.name) && size(r.name) > 0 && !has(r.selector))
            || ((!has(r.name) || size(r.name) == 0) && has(r.selector)))
        - message: ClusterRuleSet refs are named and have no namespace
          rule: self.spec.ruleRefs.all(r, r.kind != 'ClusterRuleSet' || ((!has(r.namespace)
            || size(r.namespace) == 0) && !has(r.selector)))
        - message: a selector stays in this namespace
          rule: self.spec.ruleRefs.all(r, !has(r.selector) || !has(r.namespace) ||
            size(r.namespace) == 0)
    served: true
    storage: true
    subresources: {}
