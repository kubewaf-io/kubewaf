---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: wafs.waf.kubewaf.io
spec:
  group: waf.kubewaf.io
  names:
    categories:
    - waf
    - security
    - gateway
    kind: WAF
    listKind: WAFList
    plural: wafs
    shortNames:
    - waf
    singular: waf
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: WAF is the Schema for the wafs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec defines the desired state of WAF.
              See WAFSpec for details on policy attachment, RuleSet
              resolution (with CRS support), and logging configuration.
            properties:
              challenge:
                description: |-
                  Challenge optionally installs a Proof-of-Work browser challenge filter
                  (pow-proxy-wasm / challenge-proxy-wasm) *before* the WAF filter in the chain.
                properties:
                  baseDifficulty:
                    default: 18
                    description: BaseDifficulty is the default PoW difficulty (leading
                      zero bits). Default 18.
                    maximum: 32
                    minimum: 1
                    type: integer
                  enabled:
                    default: true
                    description: Enabled installs the challenge filter when true.
                    type: boolean
                  header:
                    description: Header is an optional response header name to inject
                      after pass.
                    type: string
                  headerValue:
                    description: HeaderValue is the value for Header.
                    type: string
                  maxDifficulty:
                    description: MaxDifficulty upper bound for adaptive difficulty.
                    maximum: 32
                    minimum: 1
                    type: integer
                  minDifficulty:
                    description: MinDifficulty lower bound for adaptive difficulty.
                    maximum: 32
                    minimum: 1
                    type: integer
                  secret:
                    description: |-
                      Secret is an optional plaintext HMAC override (dev / break-glass).
                      When empty, the operator uses SecretRef or auto-generates a managed Secret.
                    type: string
                  secretRef:
                    description: |-
                      SecretRef optionally references a user-managed Secret key for the HMAC.
                      When set (and Secret is empty), that key is used instead of the
                      operator-managed Secret.
                    properties:
                      key:
                        description: Key within the Secret data map.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  wasmHTTP:
                    description: WasmHTTP overrides the challenge module download
                      URL.
                    type: string
                  wasmSHA256:
                    description: WasmSHA256 pins the challenge module binary.
                    type: string
                type: object
              corazaProxyWasmHTTP:
                description: 'CorazaProxyWasmHTTP is deprecated: use wasmHTTP (or
                  engine defaults).'
                type: string
              corazaProxyWasmImage:
                default: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
                description: |-
                  CorazaProxyWasmImage is deprecated: use engine=Coraza + wasmImage.
                  Kept for backward compatibility.
                type: string
              corazaProxyWasmSHA256:
                description: 'CorazaProxyWasmSHA256 is deprecated: use wasmSHA256.'
                type: string
              crs:
                description: |-
                  CRS contains declarative tuning knobs for the OWASP Core Rule Set.
                  Only has effect when CRSEnable is true.
                properties:
                  inboundAnomalyThreshold:
                    description: |-
                      InboundAnomalyThreshold overrides tx.inbound_anomaly_score_threshold.
                      Requests whose accumulated anomaly score meets or exceeds this value
                      are blocked (when SecRuleEngine is On).
                    minimum: 0
                    type: integer
                  outboundAnomalyThreshold:
                    description: OutboundAnomalyThreshold overrides tx.outbound_anomaly_score_threshold.
                    type: integer
                  paranoiaLevel:
                    description: |-
                      ParanoiaLevel sets both tx.detection_paranoia_level and
                      tx.blocking_paranoia_level (values 1-4).
                      Higher levels activate more rules (including many PL2/PL3/PL4 rules)
                      at the cost of increased false positive risk.
                    maximum: 4
                    minimum: 1
                    type: integer
                  removeById:
                    description: |-
                      RemoveByID emits SecRuleRemoveById for each listed CRS rule ID.
                      The rules are dropped entirely for this WAF attachment.
                    items:
                      type: integer
                    type: array
                  removeByTag:
                    description: |-
                      RemoveByTag emits SecRuleRemoveByTag for each listed tag.
                      Example tag: "attack-sqli".
                    items:
                      type: string
                    type: array
                  updateTargetById:
                    description: |-
                      UpdateTargetByID emits SecRuleUpdateTargetById directives.
                      This keeps the rule but removes specific variables from its inspection
                      (the classic surgical false-positive exclusion).
                    items:
                      description: TargetExclusion represents a single SecRuleUpdateTargetById
                        tuning operation.
                      properties:
                        id:
                          description: ID is the numeric CRS rule identifier to modify
                            (e.g. 942100).
                          type: integer
                        removeTargets:
                          description: |-
                            RemoveTargets are the variable specifications to remove.
                            Examples: "ARGS:csrf_token", "REQUEST_COOKIES:sessionid", "ARGS_GET".
                            Each will be prefixed with "!" in the generated directive.
                          items:
                            type: string
                          minItems: 1
                          type: array
                      required:
                      - id
                      - removeTargets
                      type: object
                    type: array
                type: object
              crsEnable:
                default: false
                description: |-
                  CRSEnable enables the OWASP Core Rule Set (v4.x recommended).
                  When true, CRS rules are merged with those from RuleSetRefs.
                  For engine=ModSecurity, CRS is embedded in the wasm binary and loaded via
                  virtual includes (Include @owasp_crs/*.conf).
                type: boolean
              engine:
                allOf:
                - enum:
                  - Coraza
                  - ModSecurity
                - enum:
                  - Coraza
                  - ModSecurity
                default: Coraza
                description: |-
                  Engine selects the Proxy-Wasm WAF implementation that evaluates SecLang rules.
                  Coraza (default) uses coraza-proxy-wasm; ModSecurity uses the in-tree
                  modsecurity-proxy-wasm module (embedded CRS, same directives_map JSON shape).
                type: string
              logLevel:
                default: 7
                description: |-
                  LogLevel controls verbosity of the Envoy WAF filter logs.
                  Common values: 0=off, 1=error, 2=warn, 3=info, 4=debug (up to 7).
                maximum: 7
                minimum: 0
                type: integer
              metrics:
                description: Metrics configures observability labels for the WAF WASM
                  filter.
                properties:
                  enableStats:
                    default: true
                    description: |-
                      EnableStats enables the core WAF metrics (tx total, allowed, interruptions,
                      rule matches). Default: true
                    type: boolean
                  extraLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraLabels are key/value pairs attached to all WAF filter metrics
                      (modsecurity_proxy_wasm.* / kubewaf_waf.*).
                      The operator always injects waf_namespace, waf_name, engine, and owner;
                      ExtraLabels override those keys when set.
                      Example: { "team": "payments", "env": "prod", "gateway": "external" }
                    type: object
                  includeRuleID:
                    default: true
                    description: |-
                      IncludeRuleID controls whether per-rule_id series are emitted
                      (tx interruptions and rule matches). Disabling reduces cardinality.
                      Default: true
                    type: boolean
                  name:
                    description: |-
                      Name sets the logical name / VM ID of the Wasm filter inside Envoy.
                      This influences metric prefixes (e.g. wasm.<name>.*).
                      If unset, the controller uses the engine default (e.g. kubewaf.modsecurity).
                    type: string
                  rootID:
                    description: RootID matches the root_id expected by the Wasm module
                      for stats/context.
                    type: string
                type: object
              parentRefs:
                description: |-
                  ParentRefs is the legacy nested attachment form (spec.parentRefs.targetRef).
