                        LocalPolicyTargetReference should be used.
                      properties:
                        group:
                          description: Group is the group of the target resource.
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          description: Kind is kind of the target resource.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        name:
                          description: Name is the name of the target resource.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sectionName:
                          description: |-
                            SectionName is the name of a section within the target resource. When
                            unspecified, this targetRef targets the entire resource. In the following
                            resources, SectionName is interpreted as the following:

                            * Gateway: Listener name
                            * HTTPRoute: HTTPRouteRule name
                            * Service: Port name

                            If a SectionName is specified, but does not exist on the targeted object,
                            the Policy must fail to attach, and the policy implementation should record
                            a `ResolvedRefs` or similar Condition in the Policy's status.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                    type: array
                  targetSelectors:
                    description: TargetSelectors allow targeting resources for this
                      policy based on labels
                    items:
                      properties:
                        group:
                          default: gateway.networking.k8s.io
                          description: Group is the group that this selector targets.
                            Defaults to gateway.networking.k8s.io
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          description: Kind is the resource kind that this selector
                            targets.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        matchExpressions:
                          description: MatchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: MatchLabels are the set of label selectors
                            for identifying the targeted resource.
                          type: object
                        namespaces:
                          description: |-
                            Namespaces determines which namespaces are considered for target selection.

                            If unspecified, only targets in the same namespace as this policy are considered.

                            When specified, the effective set of namespaces is always constrained to the
                            namespaces watched by Envoy Gateway.

                            Selecting targets across namespaces requires a ReferenceGrant in the target
                            namespace that allows this policy kind to reference the selected target kind.
                            Cross-namespace targets without a matching ReferenceGrant are ignored.
                          properties:
                            from:
                              default: Same
                              description: |-
                                From indicates how namespaces are selected for this target selector.

                                All means all namespaces watched by Envoy Gateway.
                                Selector means namespaces watched by Envoy Gateway that match Selector.
                              enum:
                              - Same
                              - All
                              - Selector
                              type: string
                            selector:
                              description: Selector selects namespaces when From is
                                set to Selector.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                          required:
                          - from
                          type: object
                          x-kubernetes-validations:
                          - message: selector must be specified when from is Selector
                            rule: self.from != 'Selector' || has(self.selector)
                      required:
                      - kind
                      type: object
                      x-kubernetes-validations:
                      - message: group must be gateway.networking.k8s.io
                        rule: 'has(self.group) ? self.group == ''gateway.networking.k8s.io''
                          : true '
                    type: array
                type: object
              phraseListPolicy:
                default: FailClosed
                description: |-
                  PhraseListPolicy controls publish behavior when a custom @pmFromFile /
                  @ipMatchFromFile basename cannot be resolved to a Ready PhraseList or
                  IPList in the WAF namespace. Data-files injection is always enabled.
                enum:
                - FailClosed
                - IgnoreUnknown
                type: string
              provider:
                description: |-
                  Provider selects the data-plane control plane that will receive the filter
                  slot (Envoy Gateway Extension Server, Istio EnvoyFilter, or CiliumEnvoyConfig).
                  When omitted or type=Auto, the operator discovers the provider from the
                  targeted Gateway's GatewayClass.controllerName, then from installed
                  platform CRDs (Envoy Gateway / Istio / Cilium). Status.provider reports
                  the resolved value. Rule/plugin configuration is always pushed over gRPC
                  ECDS regardless of provider.
                properties:
                  cilium:
                    description: Cilium holds Cilium-specific slot settings (only
                      used when Type=Cilium).
                    properties:
                      serviceName:
                        description: |-
                          ServiceName is the Kubernetes Service the CEC attaches to (same namespace as the WAF
                          unless ServiceNamespace is set). When empty, falls back to the WAF name.
                        type: string
                      serviceNamespace:
                        description: ServiceNamespace defaults to the WAF namespace.
                        type: string
                    type: object
                  ecdsCluster:
                    default: kubewaf_ecds
                    description: ECDSCluster is the Envoy cluster name used to open
                      the ECDS gRPC stream.
                    type: string
                  ecdsService:
                    description: |-
                      ECDSService is host:port of the kubeWAF ECDS gRPC Service
                      (e.g. kubewaf-ecds.kubewaf-system.svc.cluster.local:18001).
                    type: string
                  istio:
                    description: Istio holds Istio-specific slot settings (only used
                      when Type=Istio).
                    properties:
                      context:
                        default: GATEWAY
                        description: Context is the Istio EnvoyFilter match context
                          (GATEWAY, SIDECAR_INBOUND, ...).
                        type: string
                      workloadSelector:
                        additionalProperties:
                          type: string
                        description: 'WorkloadSelector labels for the EnvoyFilter
                          (default: istio=ingressgateway).'
                        type: object
                    type: object
                  type:
                    default: Auto
                    description: |-
                      Type selects EnvoyGateway, Istio, Cilium, or Auto.
                      Auto (default when omitted) discovers from GatewayClass.controllerName
                      of targeted Gateways, then from installed CRDs.
                    enum:
                    - Auto
                    - EnvoyGateway
                    - Istio
                    - Cilium
                    type: string
                type: object
              ruleRefs:
                description: |-
                  RuleSetRefs references RuleSets (or other RuleSets recursively).
                  Resolution, back-references, and status conditions are handled
