# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global Values
global:
  # Global Values for jobs
  jobs:
    # kubectl job configuration
    kubectl:
      image:
        # -- Set the image repository of the helm chart job
        registry: docker.io
        # -- Set the image repository of the helm chart job
        repository: clastix/kubectl
        # -- Set the image pull policy of the helm chart job
        pullPolicy: IfNotPresent
        # -- Set the image tag of the helm chart job
        tag: ""
      # -- Labels to add to the job pod
      podLabels: {}
      # -- Annotations to add to the job pod
      podAnnotations: {}
      # -- Labels to add to the job.
      labels: {}
      # -- Annotations to add to the job.
      annotations: {}
      # -- Set the restartPolicy
      restartPolicy: Never
      # -- Sets the ttl in seconds after a finished certgen job is deleted. Set to -1 to never delete.
      ttlSecondsAfterFinished: 60
      # -- Security context for the job pods.
      podSecurityContext:
        enabled: true
        seccompProfile:
          type: "RuntimeDefault"
      # -- Security context for the job containers.
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 1002
        runAsNonRoot: true
        runAsUser: 1002
      # -- Job resources
      resources: {}
      # -- Set the node selector
      nodeSelector: {}
      # -- Set list of tolerations
      tolerations: []
      # -- Set affinity rules
      affinity: {}
      # -- Set Topology Spread Constraints
      topologySpreadConstraints: []
      # -- Set a pod priorityClassName
      priorityClassName: ""

# Manage CRD Lifecycle
crds:
  # -- Install the CustomResourceDefinitions (This also manages the lifecycle of the CRDs for update operations)
  install: true
  # -- Extra Labels for CRDs
  labels: {}
  # -- Extra Annotations for CRDs
  annnotations: {}
  # -- Keep the annotations if deleted
  keep: false
  # -- Render CRDS inline (in this case use --skip-crds when installing the chart and create the config independently)
  inline: false

nameOverride: ""
fullnameOverride: ""

# Arguments for the controller
args:
  # -- Enable Profiling
  pprof: false
  # -- Log Level
  logLevel: 4
  # -- A list of extra arguments to add
  extraArgs: []

# Validating admission webhooks (SecRule, SecAction, RuleSet, WAF)
webhooks:
  # -- Install ValidatingWebhookConfiguration + TLS secret and enable --enable-webhooks
  enabled: true
  # -- Fail or Ignore when the webhook is unreachable
  failurePolicy: Fail

# Data-plane integration (ECDS + Envoy Gateway Extension Server + operator-hosted Wasm)
dataplane:
  ecds:
    # -- Container / Service port for the ECDS gRPC server
    port: 18001
    # -- DNS name Envoy uses for the ECDS cluster (defaults to release service FQDN)
    serviceHost: ""
  extensionServer:
    # -- Container / Service port for the Envoy Gateway Extension Server
    port: 5005
  wasmServe:
    # -- Container / Service port for multi-module wasm HTTP
    port: 18002
  # -- Mount path for shared wasm volume
  wasmMountPath: /wasm
  # Wasm binaries are loaded from:
  #   /wasm/modsecurity-proxy-wasm.wasm
  #   /wasm/challenge-proxy-wasm.wasm
  # (also resolved under KO_DATA_PATH/wasm in ko images).
  # -- Optional volume mounting wasm binaries under wasmMountPath
  wasmVolume: null

# -- Amount of replicas (use >=2 with leader election for HA)
replicaCount: 2

# Leader election for Kubernetes write path (status, EnvoyFilters, finalizers).
# Dataplane servers (ECDS, wasm HTTP, EG extension) always run on every pod.
leaderElection:
  # -- Enable leader election (required when replicaCount > 1)
  enabled: true

# PodDisruptionBudget (recommended when replicaCount > 1)
podDisruptionBudget:
  # -- Create a PDB
  enabled: true
  # -- Minimum available pods during voluntary disruptions
  minAvailable: 1
image:
  # -- Set the image registry
  registry: ghcr.io
  # -- Set the image repository
  repository: kubewaf-io/kubewaf
  # -- Set the image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Configuration for `imagePullSecrets` so that you can use a private images registry.
imagePullSecrets: []

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # -- The name of the service account to use.
  name: ""

# -- Annotations to add to pod
podLabels: {}

# -- Annotations to add to pod
podAnnotations: {}

# -- Set the securityContext
podSecurityContext:
  enabled: true
  seccompProfile:
    type: RuntimeDefault

# -- Set the securityContext for the container
securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# -- Configure the liveness probe using Deployment probe spec
livenessProbe:
  httpGet:
    path: /healthz
    port: 10080

# -- Configure the readiness probe using Deployment probe spec
readinessProbe:
  httpGet:
    path: /readyz
    port: 10080

# -- Set the resource requests/limits
resources: {}
# limits:
#   cpu: 200m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

# -- Set the priority class name
priorityClassName: "" # system-cluster-critical

# -- Set the node selector
nodeSelector: {}

# -- Set list of tolerations
tolerations: []

# -- Set affinity rules
affinity: {}

# -- Set topology spread constraints
topologySpreadConstraints: []

# -- Environment variables
env:
  # Disable WatchListClient to avoid noisy cache fallback logs when apiserver
  # does not have the WatchList feature gate enabled (common on older clusters).
  - name: KUBE_FEATURE_WatchListClient
    value: "false"

# -- VolumeMounts
volumeMounts:
  - name: tmpfs-vol
    mountPath: /tmp

# -- Volumes
volumes:
  - name: tmpfs-vol
    emptyDir:
      medium: Memory
      sizeLimit: 50Mi

# Monitoring Values
monitoring:
  # -- Enable Monitoring of the Operator
  enabled: false
  # PrometheusRules
  rules:
    # -- Enable deployment of PrometheusRules
    enabled: false
    # -- Install the rules into a different Namespace, as the monitoring stack one (default: the release one)
    namespace: ""
    # -- Assign additional labels
    labels: {}
    # -- Assign additional Annotations
    annotations: {}
    # -- Prometheus Groups for the rule.
    #   You can also enable the built-in WAF alerts below.
    groups: []

    # -- Enable the recommended WAF data-plane + operator alerts and recording rules.
    #   When true, a solid set of alerts for modsecurity_proxy_wasm_* and kubewaf_* metrics is included.
    wafAlerts:
      enabled: false

  # ServiceMonitor
  serviceMonitor:
    # -- Enable ServiceMonitor
    enabled: true
    # -- Install the ServiceMonitor into a different Namespace, as the monitoring stack one (default: the release one)
    namespace: ""
    # -- Assign additional labels according to Prometheus' serviceMonitorSelector matching labels
    labels: {}
    # -- Assign additional Annotations
    annotations: {}
    # -- Change matching labels
    matchLabels: {}
    # -- Prometheus Joblabel
    jobLabel: app.kubernetes.io/name
    # -- Set targetLabels for the serviceMonitor
    targetLabels: []
    serviceAccount:
      # @default -- `capsule-proxy`
      name: ""
      # @default -- `.Release.Namespace`
      namespace: ""
    endpoint:
      # -- Set the scrape interval for the endpoint of the serviceMonitor
      interval: "15s"
      # -- Set the scrape timeout for the endpoint of the serviceMonitor
      scrapeTimeout: ""
      # -- Set metricRelabelings for the endpoint of the serviceMonitor
      metricRelabelings: []
      # -- Set relabelings for the endpoint of the serviceMonitor
      relabelings: []

# ---------------------------------------------------------------------------
# Subresource API Server (aggregated subresources.kubewaf.io) + probe Test Server
# Disabled by default. Probes still require probeTestServer; directives/query do not.
# ---------------------------------------------------------------------------
subresourceApi:
  # -- Deploy the Subresource API Server + APIService
  enabled: true
  probes:
    # -- Register /probes (requires probeTestServer.enabled)
    enabled: true
  directives:
    # -- Register GET …/wafs/{name}/directives (no Test Server)
    enabled: false
  query:
    # -- Register GET …/metrics, /traces, /clustermetrics (operator-side VM/VT proxy)
    enabled: true
  # -- Replica count
  replicaCount: 1
  image:
    # -- Image registry (empty inherits image.registry)
    registry: ""
    # -- Image repository for cmd/subresource-api
    repository: kubewaf-io/kubewaf-subresource-api
    # -- Image tag (empty inherits image.tag / Chart.AppVersion)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Resources for Subresource API pods
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  concurrency:
    # -- Max in-flight probes per namespace
    perNamespace: 4
    # -- Process-wide max concurrent probes
    globalMaxInFlight: 32
  service:
    # -- Service port exposed to apiserver (APIService)
    port: 443
  # -- Optional pod annotations
  podAnnotations: {}
  # -- Optional pod labels
  podLabels: {}
  # -- Create NetworkPolicy (defense-in-depth; kind often permissive)
  networkPolicy:
    enabled: true
  testServer:
    # -- URL of Test HTTP Server (cluster DNS)
    # leave empty to use http://{{ fullname }}-probe-test-server:port
    url: ""
    # -- Shared bearer Secret name (empty = {{ fullname }}-probe-eval-token)
    tokenSecretName: ""
    connectTimeoutSeconds: 2

# Managed observability (Envoy OTLP → cluster kubewaf_otel). Off by default.
# Product path is the Envoy stats sink + OTel access logger, not scrape and not Wasm httpCall.
observability:
  managed:
    # -- Enable the managed OTLP plane (Collector + metrics backend)
    enabled: true
    # -- lite = metrics only; full = metrics + security traces
    profile: lite
    otlp:
      # -- Empty = in-cluster {{ fullname }}-otel-collector:4317
      endpoint: ""
      # -- Envoy sink / access logger protocol
      protocol: grpc
    collector:
      enabled: true
      image:
        registry: docker.io
        repository: otel/opentelemetry-collector-contrib
        tag: "0.128.0"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    victoriaMetrics:
      # -- In-cluster single-node VM (required for lite/full unless endpoint or remote_write is set)
      enabled: true
      # -- External VM / vmagent OTLP metrics ingest. Empty uses in-cluster VM when enabled.
      endpoint: ""
      image:
        registry: docker.io
        repository: victoriametrics/victoria-metrics
        tag: "v1.150.0"
        pullPolicy: IfNotPresent
      retentionPeriod: "14d"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
    prometheusRemoteWrite:
      # -- Prometheus remote_write (not OTLP). Use victoriaMetrics.endpoint for OTLP ingest.
      enabled: false
      endpoint: ""
    victoriaTraces:
      enabled: false
      endpoint: ""
      image:
        registry: docker.io
        repository: victoriametrics/victoria-traces
        tag: "v0.4.0"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
    grafana:
      enabled: false
    # -- Set true after applying the Envoy/Istio bootstrap fragment (cluster + sink + tags).
    injectConfigured: false
    traces:
      sampleDisruptive: "1.0"
      sampleNonDisruptive: "0.25"
      redact: true
      includeMatchDataDefault: false
    networkPolicy:
      enabled: true
    # Query ingress is collector + subresource-api / operator pods only.
    # kube-system / CIDR peers are not used (Headlamp queries via subresources).
    ciliumNetworkPolicy:
      enabled: false
      nodeCIDRs: []
    alerts:
      enabled: true

probeTestServer:
  # -- Deploy go-coraza Test HTTP Server (required only when subresourceApi.probes.enabled)
  enabled: true
  # -- Replica count (compile cache is per-pod if enabled later)
  replicaCount: 1
  image:
    registry: ""
    repository: kubewaf-io/kubewaf-probe-test-server
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  concurrency:
    globalMaxInFlight: 16
    maxConcurrentCompiles: 4
  service:
    port: 8080
  auth:
    # -- Shared bearer Secret name (empty = {{ fullname }}-probe-eval-token)
    tokenSecretName: ""
  # -- Create NetworkPolicy allowing only Subresource API pods
  networkPolicy:
    enabled: true
  podAnnotations: {}
  podLabels: {}
