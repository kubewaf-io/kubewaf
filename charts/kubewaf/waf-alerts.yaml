# Embedded WAF alerts (loaded when monitoring.rules.wafAlerts.enabled = true)
groups:
  - name: kubewaf.waf.alerts
    rules:
      - alert: KubeWAFHighBlockRate
        expr: |
          sum(rate(modsecurity_proxy_wasm_tx_interruptions[5m])) / clamp_min(sum(rate(modsecurity_proxy_wasm_tx_total[5m])), 1) > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WAF block rate detected"
          description: "The WAF is blocking a large percentage of traffic."

      - alert: KubeWAFPolicyNotReady
        expr: kubewaf_wafenvoygateway_ready == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "WAF is not Ready"
          description: "WAF policy {{ $labels.name }} has been unhealthy for a long time."

      - alert: KubeWAFNoRulesLoaded
        expr: kubewaf_rules_loaded == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "WAF policy has zero rules loaded"
          description: "WAF {{ $labels.name }} is protecting nothing."

