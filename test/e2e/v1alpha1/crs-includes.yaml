apiVersion: seclang.kubewaf.io/v1alpha1
kind: Include
metadata:
  name: crs-setup
  namespace: default
spec:
  order: 20
  placement: BeforeCRS
  virtualPath: "@crs-setup.conf"
---
apiVersion: seclang.kubewaf.io/v1alpha1
kind: Include
metadata:
  name: owasp
  namespace: default
spec:
  order: 10
  placement: AfterCRS
  virtualPath: "@owasp_crs/*.conf"
---
apiVersion: seclang.kubewaf.io/v1alpha1
kind: SecPolicy
metadata:
  name: crs
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  rules:
    - kind: Include
      name: crs-setup
    - kind: Include
      name: owasp
  engine: "On"
  inspection: RequestOnly
  requestBodyAccess: true
