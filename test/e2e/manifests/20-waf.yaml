# Custom SecRule example for e2e / manual testing.
# Detects and blocks requests from known malicious scanners by User-Agent.
apiVersion: seclang.kubewaf.io/v1beta1
kind: SecRule
metadata:
  name: block-bad-user-agent
  namespace: demo
  labels:
    app: demo-waf
spec:
  secLangRules:
  - metadata:
      id: 100001
      phase: "1"
      message: "Malicious scanner detected"
      severity: "ERROR"
      tags:
        - "attack-generic"
    conditions:
    - collections:
      - name: REQUEST_HEADERS
        arguments:
        - User-Agent
      operator:
        name: rx
        value: (?:nikto|sqlmap|nessus|openvas)
    actions:
      disruptive:
        disruptiveActionType: deny
      data:
      - dataActionType: status
        value: "403"
---
apiVersion: waf.kubewaf.io/v1beta1
kind: RuleSet
metadata:
  name: demo-rules
  namespace: demo
spec:
  ruleRefs:
  - kind: SecRule
    group: seclang.kubewaf.io
    version: v1beta1
    selector:
      matchLabels:
        app: demo-waf

---
apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf
  namespace: demo
spec:
  # Attach the WAF policy to the HTTPRoute defined in 10-gateway-api.yaml
  parentRefs:
    targetRef:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httpbin
      # namespace defaults to the WAF's namespace (demo). Must be the same namespace.
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1

  # Optional: enable the full OWASP CRS on top of your custom rules
  crsEnable: false
  logLevel: 4


  metrics:
    name: "shop-prod"                 # Affects Envoy Wasm filter naming
    extraLabels:
      team: "payments"
      environment: "prod"
      gateway: "external"
    includeRuleID: true               # Set false to reduce cardinality
    enableStats: true
