# Gateway API resources + Envoy Gateway configuration for Kind
# - Configures EnvoyProxy to use ClusterIP (so no LoadBalancer is required in Kind)
# - Defines a Gateway (demo-gateway) and HTTPRoute (httpbin) in the demo namespace
# - The HTTPRoute points to the httpbin Service

---
# EnvoyProxy configuration for the 'eg' GatewayClass (Kind-friendly)
# Note: 'envoyService' is the correct field name for Envoy Gateway v1.0.x / early v1.1
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
  telemetry:
    metrics:
      prometheus: {}
---
# Update the default GatewayClass installed by Envoy Gateway to use our EnvoyProxy config
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-proxy-config
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: demo
spec:
  parentRefs:
  - name: demo-gateway
  hostnames:
  - "demo.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: httpbin
      port: 80
