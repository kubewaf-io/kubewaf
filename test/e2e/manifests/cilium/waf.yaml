apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf-cilium
  namespace: demo
  labels:
    e2e: "true"
    provider: cilium
spec:
  provider:
    type: Cilium
    cilium:
      # Attach CEC to the httpbin Service (Cilium L7 selection).
      serviceName: httpbin
      serviceNamespace: demo
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo-gateway
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1
  # Full OWASP CRS, max-strict tuning (PL4 + low anomaly thresholds).
  crsEnable: true
  crs:
    paranoiaLevel: 4
    inboundAnomalyThreshold: 1
    outboundAnomalyThreshold: 1
  logLevel: 3
