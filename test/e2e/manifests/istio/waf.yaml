apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf-istio
  namespace: demo
  labels:
    e2e: "true"
    provider: istio
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo-gateway
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1
  # path-b wasm default: custom SecRules only. crsEnable:true needs *-full wasm.
  crsEnable: false
  crs:
    paranoiaLevel: 4
    inboundAnomalyThreshold: 1
    outboundAnomalyThreshold: 1
  logLevel: 3
