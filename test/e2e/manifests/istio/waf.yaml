apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf-istio
  namespace: demo
  labels:
    e2e: "true"
    provider: istio
spec:
  provider:
    type: Istio
    istio:
      # Match Istio ingress gateway pods (demo profile / ambient gateway labels vary).
      workloadSelector:
        istio: ingressgateway
      context: GATEWAY
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo-gateway
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1
  # Full OWASP CRS, max-strict tuning (PL4 + low anomaly thresholds).
  crsEnable: true
  crs:
    paranoiaLevel: 4
    inboundAnomalyThreshold: 1
    outboundAnomalyThreshold: 1
  logLevel: 3
