apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf-eg
  namespace: demo
  labels:
    e2e: "true"
    provider: envoy-gateway
spec:
  provider:
    type: EnvoyGateway
  parentRefs:
    targetRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: demo-gateway
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1
  crsEnable: false
  logLevel: 3
