apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf-eg
  namespace: demo
  labels:
    e2e: "true"
    provider: envoy-gateway
spec:
  engine: ModSecurity
  provider:
    type: EnvoyGateway
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo-gateway
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1
  # Full OWASP CRS, max-strict tuning (PL4 + low anomaly thresholds).
  # Expect more false positives on real apps; loosen thresholds or drop rules as needed.
  crsEnable: true
  crs:
    paranoiaLevel: 4
    inboundAnomalyThreshold: 1
    outboundAnomalyThreshold: 1
  logLevel: 3
