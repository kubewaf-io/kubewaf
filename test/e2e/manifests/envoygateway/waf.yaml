apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: demo-waf-eg
  namespace: demo
  labels:
    e2e: "true"
    provider: envoy-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo-gateway
  ruleRefs:
  - kind: RuleSet
    name: demo-rules
    namespace: demo
    group: waf.kubewaf.io
    version: v1beta1
  # Default e2e / operator embed uses path-b wasm (no embedded CRS rule confs).
  # crsEnable:true needs the second-class full-catalog image (*-full) for
  # Include @owasp_crs. CRS regression is Path B (structured SecRules + path-b wasm).
  crsEnable: false
  crs:
    paranoiaLevel: 4
    inboundAnomalyThreshold: 1
    outboundAnomalyThreshold: 1
  logLevel: 3
