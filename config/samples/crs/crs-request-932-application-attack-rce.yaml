  metadata:
    comment: "[ Unix direct remote command execution ]\n\nDetects Unix commands at the start of a parameter (direct RCE).\n\
      Example: foo=wget%20www.example.com\n\nIn this rule we use a different check from command injection (rule 932230), where\
      \ a\ncommand string is appended (injected) to a regular parameter, and then\npassed to a shell unescaped.\n\nAdditionaly,\
      \ we require a trailing space (denoting command parameters) or command\nseparator character after the command.\n\nThis\
      \ rule is also triggered by an Oracle WebLogic Remote Command Execution exploit:\n[ Oracle WebLogic vulnerability CVE-2017-10271\
      \ - Exploit tested: https://www.exploit-db.com/exploits/43458 ]\n\nAn effort was made to combat evasions by shell quoting\
      \ (e.g. 'ls',\n'l'\"s\", \\l\\s are all valid). ModSecurity has a t:cmdLine\ntransformation built-in to deal with this,\
      \ but unfortunately, it\nreplaces ';' characters and lowercases the payload, which is less\nuseful for this case. However,\
      \ emulating the transformation makes\nthe regexp more complex.\n\nThis is the base Rule to prevent Direct Unix Command\
      \ Injection\nwithout prefix match.\n\nRule relations:\n\n .932230 (base rule, PL1, targets prefix + two and three character\
      \ commands)\n ..932231 (stricter sibling, PL2, targets prefix + the source shortcut command)\n ..932232 (stricter sibling,\
      \ PL3, targets prefix + additional command words)\n .932235 (base rule, PL1, targets prefix + known command word of\
      \ length > 3 without evasion)\n\n .932250 (base rule, PL1, targets two and three character commands)\n .932260 (base\
      \ rule, PL1, targets known command word of length > 3 without evasion)\n .932340 (PL-1, matches commands with no arguments)\n\
      \ .932350 (PL-3, matches commands with no arguments)\n\n .932240 (generic detection, PL2, targets generic evasion attempts)\n\
      \ .932236 (stricter sibling of 932230, 932235, 932250, 932260, PL2,\n      - with and without prefix\n      - words\
      \ of any length)\n ..932239 (sibling of 932236, PL2,\n      - with and without prefix\n      - words of any length\n\
      \      - targets request headers user-agent and referer only\n      - excluded words: known user-agents)\n ..932238\
      \ (stricter sibling of 932236, PL3,\n      - no excluded words)\n .932237 (stricter sibling of 932230, 932235, 932250,\
      \ 932260, PL3,\n      - targets request headers user-agent and referer only\n      - without prefix\n      - with word\
      \ boundaries\n      - words of any length\n      - excluded words: known user-agents)\n\n\nRegular expression generated\
      \ from regex-assembly/932250.ra.\nTo update the regular expression run the following shell script\n(consult https://coreruleset.org/docs/development/regex_assembly/\
      \ for details):\n  crs-toolchain regex update 932250\n\n"
    id: 932250
    message: 'Remote Command Execution: Direct Unix Command Execution'
    phase: '2'
    severity: CRITICAL
    tags:
    - application-multi
    - language-shell
    - platform-unix
    - attack-rce
    - paranoia-level/1
    - OWASP_CRS/ATTACK-RCE
    - capec/1000/152/248/88
  order: 932250
