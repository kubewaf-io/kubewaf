    message: 'Remote Command Execution: Unix Command Injection evasion attempt detected'
    phase: '2'
    severity: CRITICAL
    tags:
    - application-multi
    - language-shell
    - platform-unix
    - attack-rce
    - paranoia-level/2
    - OWASP_CRS/ATTACK-RCE
