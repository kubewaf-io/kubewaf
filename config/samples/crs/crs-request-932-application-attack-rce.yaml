  metadata:
    comment: "[ Windows command injection ]\n\nThis rule detects Windows shell command injections.\nIf you are not running\
      \ Windows, it is safe to disable this rule.\n\nNew in CRSv4: The rules 932110 and 932115 were reorganized and renumbered\
      \ to 932370 and 932380.\nThe new rules target specific Windows binaries to simplify future updates of the command list.\n\
      \nA command injection takes a form such as:\n\n  foo.jpg&ver /r\n  foo.jpg|ver /r\n\nThe vulnerability exists when an\
      \ application executes a shell command\nwithout proper input escaping/validation.\n\nTo prevent false positives, we\
      \ look for a 'starting sequence' that\nprecedes a command in CMD syntax, such as: ; | & `\n\nAnatomy of the regexp:\n\
      \n1. Starting tokens\n\n;        ;cmd\n\\{       {cmd\n\\|       |cmd\n\\|\\|     ||cmd\n&        &cmd\n&&       &&cmd\n\
      \\n       \\ncmd\n\\r       \\rcmd\n`        `cmd\n\n2. Command prefixes\n\n(        (cmd)\n,        ,cmd\n@       \
      \ @cmd\n'        'cmd'\n\"        \"cmd\"\n\\s       spacing+cmd\n\n3. Paths\n\n[\\w'\\\"\\./]+/                   \
      \       /path/cmd\n[\\x5c'\\\"\\^]*\\w[\\x5c'\\\"\\^]*:.*\\x5c     C:\\Program Files\\cmd\n[\\^\\.\\w '\\\"/\\x5c]*\\\
      x5c)?[\\\"\\^]*       \\\\net\\share\\dir\\cmd\n\n4. Quoting\n\n\\\"       \"cmd\"\n\\^       ^cmd\n\n5. Extension/switches\n\
      \n\\.[\\\"\\^]*\\w+      cmd.com, cmd.exe, etc.\n/b                cmd/h\n\nAn effort is made to combat evasions by\
      \ CMD syntax; for example,\nthe following strings are valid: c^md, @cmd, \"c\"md. ModSecurity\nhas a t:cmdLine transformation\
      \ built-in to deal with some of these,\nbut unfortunately, that transformation replaces ';' characters (so\nwe cannot\
      \ match on the start of a command) and '\\' characters (so we\nhave trouble matching paths). This makes the regexp more\
      \ complex.\n\nThis rule is case-insensitive.\n\nRegular expression generated from regex-assembly/932370.ra.\nTo update\
      \ the regular expression run the following shell script\n(consult https://coreruleset.org/docs/development/regex_assembly/\
      \ for details):\n  crs-toolchain regex update 932370\n\n"
    id: 932370
    message: 'Remote Command Execution: Windows Command Injection'
    phase: '2'
    severity: CRITICAL
    tags:
    - application-multi
    - language-shell
    - platform-windows
    - attack-rce
    - paranoia-level/1
    - OWASP_CRS/ATTACK-RCE
    - capec/1000/152/248/88
  order: 932370
