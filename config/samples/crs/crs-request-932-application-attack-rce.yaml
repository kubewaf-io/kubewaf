      \ prefix + the source shortcut command)\n ..932232 (stricter sibling, PL3, targets prefix + additional command words)\n\
      \ .932235 (base rule, PL1, targets prefix + known command word of length > 3 without evasion)\n\n .932250 (base rule,\
      \ PL1, targets two and three character commands)\n .932260 (base rule, PL1, targets known command word of length > 3\
      \ without evasion)\n .932340 (PL-1, matches commands with no arguments)\n .932350 (PL-3, matches commands with no arguments)\n\
      \n .932240 (generic detection, PL2, targets generic evasion attempts)\n .932236 (stricter sibling of 932230, 932235,\
      \ 932250, 932260, PL2,\n      - with and without prefix\n      - words of any length)\n ..932239 (sibling of 932236,\
      \ PL2,\n      - with and without prefix\n      - words of any length\n      - targets request headers user-agent and\
      \ referer only\n      - excluded words: known user-agents)\n ..932238 (stricter sibling of 932236, PL3,\n      - no\
      \ excluded words)\n .932237 (stricter sibling of 932230, 932235, 932250, 932260, PL3,\n      - targets request headers\
      \ user-agent and referer only\n      - without prefix\n      - with word boundaries\n      - words of any length\n \
      \     - excluded words: known user-agents)\n\n\n\nRegular expression generated from regex-assembly/932239.ra.\nTo update\
      \ the regular expression run the following shell script\n(consult https://coreruleset.org/docs/development/regex_assembly/\
      \ for details):\n  crs-toolchain regex update 932239\n\n"
