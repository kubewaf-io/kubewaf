apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  labels:
    app.kubernetes.io/name: wafv2
    app.kubernetes.io/managed-by: kustomize
  name: wafinstance-sample
spec:
  # Data-plane provider: EnvoyGateway (default), Istio, or Cilium
  provider:
    type: EnvoyGateway

  # Product WAF engine (modsecurity-proxy-wasm)
  engine: ModSecurity

  # Optional browser PoW challenge (pow-proxy-wasm) before the WAF filter.
  # HMAC is auto-generated into a managed Secret (<waf-name>-challenge-hmac).
  # challenge:
  #   enabled: true
  #   baseDifficulty: 18

  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg

  ruleRefs:
    - kind: "RuleSet"
      name: ruleset-sample
      namespace: default
      group: "waf.kubewaf.io"
      version: "v1beta1"

  # wasmImage: ghcr.io/kubewaf-io/modsecurity-proxy-wasm:latest  # OCI ref (docs / future)
