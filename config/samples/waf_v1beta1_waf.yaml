apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  labels:
    app.kubernetes.io/name: kubewaf
    app.kubernetes.io/managed-by: kustomize
  name: waf-sample
spec:
  # provider is omitted on purpose: the operator discovers the data plane from
  # targetRef → Gateway → GatewayClass.controllerName (Envoy Gateway / Istio /
  # Cilium). See status.provider and status.providerDetection after reconcile.
  # Override only if needed: provider.type: EnvoyGateway|Istio|Cilium

  # Optional browser PoW challenge (pow-proxy-wasm) before the WAF filter.
  # HMAC is auto-generated into a managed Secret (<waf-name>-challenge-hmac).
  # challenge:
  #   enabled: true
  #   baseDifficulty: 18

  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg

  ruleRefs:
    - kind: "RuleSet"
      name: ruleset-sample
      namespace: default
      group: "waf.kubewaf.io"
      version: "v1beta1"
