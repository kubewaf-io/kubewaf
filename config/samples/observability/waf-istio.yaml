# Operator: ECDS Upsert + EnvoyFilter (CLUSTER ADD kubewaf_otel, HCM access log).
# No Istio Telemetry CR. Bootstrap override adds stats sink + cluster (with ECDS).
apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: shop-waf
  namespace: shop
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shop-gw
  # GatewayClass.controllerName contains istio.io → Istio
  # Or set: provider: { type: Istio }
  ruleRefs:
    - kind: RuleSet
      name: shop-rules
      namespace: shop
  telemetry:
    mode: Managed
    traces:
      enabled: true
      redact: true
      includeMatchData: false
