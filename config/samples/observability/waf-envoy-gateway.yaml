# Operator: ECDS Upsert + Extension Server HCM access log.
# Does not set EnvoyProxy.spec.telemetry. Bootstrap JSONPatch (same class as
# kubewaf_ecds) adds cluster kubewaf_otel + OTel stats sink.
apiVersion: waf.kubewaf.io/v1beta1
kind: WAF
metadata:
  name: shop-waf
  namespace: shop
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shop-gw
  # GatewayClass.controllerName contains envoyproxy.io → EnvoyGateway
  ruleRefs:
    - kind: RuleSet
      name: shop-rules
      namespace: shop
  telemetry:
    mode: Managed
    traces:
      enabled: true
      redact: true
      includeMatchData: false
