---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: includes.seclang.kubewaf.io
spec:
  group: seclang.kubewaf.io
  names:
    categories:
    - waf
    - security
    kind: Include
    listKind: IncludeList
    plural: includes
    shortNames:
    - inc
    singular: include
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.placement
      name: Placement
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Include is one SecLang Include directive.
          The kind is Include, not SecInclude, because the directive is Include.
          SecRule and SecAction are named after their directives the same way.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IncludeSpec is one Include.
              A virtual path is a module-embedded file such as @crs-setup.conf or @owasp_crs/*.conf.
              A ConfigMap key is copied onto the kubewaf-seclang mount and included by absolute path.
              A glob is legal only on a virtual path.
            properties:
              configMapRef:
                description: ConfigMapRef selects SecLang file content. The key cannot
                  contain a glob.
                properties:
                  key:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              markerAfter:
                maxLength: 64
                pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                type: string
              order:
                default: 1000
                format: int32
                type: integer
              placement:
                default: AfterCRS
                description: |-
                  Placement selects which file a SecPolicy writes the object into.
                  BeforeCRS is included first. AfterCRS is included second.
                  CRS itself is an Include object, not a boolean on the policy.
                enum:
                - BeforeCRS
                - AfterCRS
                type: string
              virtualPath:
                description: |-
                  VirtualPath is a module-embedded path. It must start with @.
                  One * glob is allowed, as in @owasp_crs/*.conf.
                maxLength: 256
                pattern: ^@[A-Za-z0-9][A-Za-z0-9._/-]*(\*[A-Za-z0-9._/-]*)?$
                type: string
            type: object
          status:
            description: SecLangStatus is the compiled text of one object.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              secLang:
                description: SecLang is the rendered directive text, including a trailing
                  SecMarker line.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: set exactly one of virtualPath or configMapRef
          rule: (has(self.spec.virtualPath) && size(self.spec.virtualPath) > 0 &&
            !has(self.spec.configMapRef)) || ((!has(self.spec.virtualPath) || size(self.spec.virtualPath)
            == 0) && has(self.spec.configMapRef))
    served: true
    storage: true
    subresources:
      status: {}
