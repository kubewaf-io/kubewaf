---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: secpolicies.seclang.kubewaf.io
spec:
  group: seclang.kubewaf.io
  names:
    categories:
    - waf
    - security
    kind: SecPolicy
    listKind: SecPolicyList
    plural: secpolicies
    shortNames:
    - sp
    singular: secpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecPolicy binds SecRule, SecAction, and Include objects to a Gateway or HTTPRoute.
          It does not create an EnvoyProxy and it does not patch a Gateway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecPolicySpec is the attachment.
            properties:
              dataFiles:
                description: DataFiles are bodies for @pmFromFile and @ipMatchFromFile.
                items:
                  description: DataFile is one @pmFromFile or @ipMatchFromFile body.
                  properties:
                    configMapRef:
                      description: ConfigMapKeyRef names a key in a ConfigMap in the
                        same namespace.
                      properties:
                        key:
                          maxLength: 253
                          minLength: 1
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                          type: string
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    content:
                      description: Content and ConfigMapRef are mutually exclusive.
                      type: string
                    name:
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*\.data$
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
              defaultActions:
                description: |-
                  DefaultActions emits one SecDefaultAction per phase, before user rules.
                  Leave empty to keep the module and CRS defaults. Phases must be unique.
                items:
                  description: DefaultAction is one SecDefaultAction phase.
                  properties:
                    actions:
                      description: Actions is a raw SecLang action list, for example
                        "log,auditlog,deny,status:403".
                      maxLength: 1024
                      type: string
                    phase:
                      maximum: 5
                      minimum: 1
                      type: integer
                  required:
                  - actions
                  - phase
                  type: object
                maxItems: 5
                type: array
              engine:
                default: "On"
                description: Engine maps to SecRuleEngine.
                enum:
                - "On"
                - DetectionOnly
                - "Off"
                type: string
              inspection:
                default: RequestOnly
                description: |-
                  Inspection maps to the Coraza module mode.
                  RequestOnly evaluates phases 1 and 2. Full also evaluates 3, 4, and 5.
                enum:
                - RequestOnly
                - Full
                type: string
              moduleName:
                default: composer
                description: |-
                  ModuleName is the dynamicModules[].name the platform registered.
                  The EnvoyExtensionPolicy references this name. It does not register the module.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                type: string
              postDirectives:
                description: |-
                  PostDirectives are SecLang lines written at the end of the after file.
                  Intended for SecRuleRemoveById, SecRuleRemoveByTag, SecRuleUpdateTargetById.
                items:
                  type: string
                maxItems: 64
                type: array
              requestBodyAccess:
                default: true
                description: RequestBodyAccess emits SecRequestBodyAccess.
                type: boolean
              responseBodyAccess:
                default: false
                description: |-
                  ResponseBodyAccess emits SecResponseBodyAccess.
                  Default false. Full inspection still needs this for phase 4.
                type: boolean
              rules:
                description: |-
                  Rules selects SecRule, SecAction, and Include objects in this namespace.
                  Each entry is a name or a label selector.
                items:
                  description: RuleSelector picks objects in the policy namespace.
                  properties:
                    kind:
                      enum:
                      - SecRule
                      - SecAction
                      - Include
                      type: string
                    name:
                      description: Name and Selector are mutually exclusive. One is
                        required.
                      type: string
                    selector:
                      description: |-
                        A label selector is a label query over a set of resources. The result of matchLabels and
                        matchExpressions are ANDed. An empty label selector matches all objects. A null
                        label selector matches no objects.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - kind
                  type: object
                minItems: 1
                type: array
              targetRefs:
                description: |-
                  TargetRefs attach to a Gateway or an HTTPRoute in this namespace.
                  EnvoyExtensionPolicy is same-namespace, and so is this policy.
                items:
                  description: |-
                    LocalPolicyTargetReference identifies an API object to apply a direct or
                    inherited policy to. This should be used as part of Policy resources
                    that can target Gateway API resources. For more information on how this
                    policy attachment model works, and a sample Policy resource, refer to
                    the policy attachment documentation for Gateway API.
                  properties:
                    group:
                      description: Group is the group of the target resource.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      description: Kind is kind of the target resource.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: Name is the name of the target resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  type: object
                maxItems: 16
                minItems: 1
                type: array
            required:
            - rules
            - targetRefs
            type: object
          status:
            description: SecPolicyStatus is the attachment result. The reconciler
              is not part of M1.
            properties:
              actionsLoaded:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configMapName:
                type: string
              configMapNamespace:
                type: string
              crsVersion:
                type: string
              engineImage:
                type: string
              envoyExtensionPolicyName:
                type: string
              envoyProxyName:
                type: string
              envoyProxyNamespace:
                type: string
              gatewayName:
                type: string
              includesLoaded:
                format: int32
                type: integer
              rulesLoaded:
                format: int32
                type: integer
              secLangHash:
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: targetRefs must be a Gateway or HTTPRoute in gateway.networking.k8s.io
          rule: self.spec.targetRefs.all(t, t.group == 'gateway.networking.k8s.io'
            && t.kind in ['Gateway', 'HTTPRoute'])
        - message: each rule selector sets name or selector, not both
          rule: self.spec.rules.all(r, (has(r.name) && size(r.name) > 0 && !has(r.selector))
            || ((!has(r.name) || size(r.name) == 0) && has(r.selector)))
        - message: each data file sets content or configMapRef, not both
          rule: '!has(self.spec.dataFiles) || self.spec.dataFiles.all(f, (has(f.content)
            && !has(f.configMapRef)) || (!has(f.content) && has(f.configMapRef)))'
    served: true
    storage: true
    subresources:
      status: {}
