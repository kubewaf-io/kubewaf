---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: wafs.waf.kubewaf.io
spec:
  group: waf.kubewaf.io
  names:
    categories:
    - waf
    - security
    - gateway
    kind: WAF
    listKind: WAFList
    plural: wafs
    shortNames:
    - waf
    singular: waf
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: WAF is the Schema for the wafs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec defines the desired state of WAF.
              See WAFSpec for details on policy attachment, RuleSet
              resolution (with CRS support), and logging configuration.
            properties:
              corazaProxyWasmHTTP:
                description: |-
                  CorazaProxyWasmHTTP is the HTTP(S) URL where Envoy fetches the
                  coraza-proxy-wasm .wasm binary (required for ECDS). When empty, the
                  operator default (--wasm-http-url) is used.
                type: string
              corazaProxyWasmImage:
                default: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
                description: |-
                  CorazaProxyWasmImage is the OCI image reference for documentation /
                  future OCI fetchers. ECDS mode loads the binary via CorazaProxyWasmHTTP.
                type: string
              corazaProxyWasmSHA256:
                description: |-
                  CorazaProxyWasmSHA256 is the expected SHA-256 of the remote .wasm binary.
                  Strongly recommended in production.
                type: string
              crs:
                description: |-
                  CRS contains declarative tuning knobs for the OWASP Core Rule Set.
                  Only has effect when CRSEnable is true.
                  The operator emits the resulting directives (paranoia, thresholds, exclusions)
                  in the order required by CRS (setup actions before the rule includes,
                  removal/update directives after the includes).
                properties:
                  inboundAnomalyThreshold:
                    description: |-
                      InboundAnomalyThreshold overrides tx.inbound_anomaly_score_threshold.
                      Requests whose accumulated anomaly score meets or exceeds this value
                      are blocked (when SecRuleEngine is On).
                    minimum: 0
                    type: integer
                  outboundAnomalyThreshold:
                    description: OutboundAnomalyThreshold overrides tx.outbound_anomaly_score_threshold.
                    type: integer
                  paranoiaLevel:
                    description: |-
                      ParanoiaLevel sets both tx.detection_paranoia_level and
                      tx.blocking_paranoia_level (values 1-4).
                      Higher levels activate more rules (including many PL2/PL3/PL4 rules)
                      at the cost of increased false positive risk.
                    maximum: 4
                    minimum: 1
                    type: integer
                  removeById:
                    description: |-
                      RemoveByID emits SecRuleRemoveById for each listed CRS rule ID.
                      The rules are dropped entirely for this WAF attachment.
                    items:
                      type: integer
                    type: array
                  removeByTag:
                    description: |-
                      RemoveByTag emits SecRuleRemoveByTag for each listed tag.
                      Example tag: "attack-sqli".
                    items:
                      type: string
                    type: array
                  updateTargetById:
                    description: |-
                      UpdateTargetByID emits SecRuleUpdateTargetById directives.
                      This keeps the rule but removes specific variables from its inspection
                      (the classic surgical false-positive exclusion).
                    items:
                      description: TargetExclusion represents a single SecRuleUpdateTargetById
                        tuning operation.
                      properties:
                        id:
                          description: ID is the numeric CRS rule identifier to modify
                            (e.g. 942100).
                          type: integer
                        removeTargets:
                          description: |-
                            RemoveTargets are the variable specifications to remove.
                            Examples: "ARGS:csrf_token", "REQUEST_COOKIES:sessionid", "ARGS_GET".
                            Each will be prefixed with "!" in the generated directive.
                          items:
                            type: string
                          minItems: 1
                          type: array
                      required:
                      - id
                      - removeTargets
                      type: object
                    type: array
                type: object
              crsEnable:
                default: false
                description: |-
                  CRSEnable enables the OWASP Core Rule Set (v4.x recommended).
                  When true, CRS rules are merged with those from RuleSetRefs.
                type: boolean
              logLevel:
                default: 7
                description: |-
                  LogLevel controls verbosity of the Envoy WAF filter logs.
                  Common values: 0=off, 1=error, 2=warn, 3=info, 4=debug (up to 7).
                maximum: 7
                minimum: 0
                type: integer
              metrics:
                description: |-
                  Metrics configures observability for the Coraza WASM filter.
                  Allows controlling metric names, extra labels on interruption metrics,
                  and whether to include high-cardinality rule_id labels.
                properties:
                  enableStats:
                    default: true
                    description: |-
                      EnableStats enables the core WAF metrics (tx total + interruptions).
                      Default: true
                    type: boolean
                  extraLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraLabels are key/value pairs passed to coraza-proxy-wasm.
                      They will be attached to waf_filter_tx_interruptions metrics.
                      Example: { "team": "payments", "env": "prod", "gateway": "external" }
                    type: object
                  includeRuleID:
                    default: true
                    description: |-
                      IncludeRuleID controls whether the specific `rule_id` label is included
                      on waf_filter_tx_interruptions metrics.
                      Disabling this significantly reduces cardinality in high-traffic environments.
                      Default: true
                    type: boolean
                  name:
                    description: |-
                      Name sets the logical name / VM ID of the Wasm filter inside Envoy.
                      This influences metric prefixes (e.g. wasm.<name>.*).
                      If unset, the controller uses "kubewaf.io".
                    type: string
                  rootID:
                    description: RootID matches the root_id expected by the Wasm module
                      for stats/context.
                    type: string
                type: object
              parentRefs:
                description: |-
                  ParentRefs specifies the target resources (typically Gateways or
                  GatewayClasses) to which this WAF policy should be attached.
                  Follows Envoy Gateway policy attachment semantics (targetRef/targetRefs).
                properties:
                  targetRef:
                    description: |-
                      TargetRef is the name of the resource this policy is being attached to.
                      This policy and the TargetRef MUST be in the same namespace for this
                      Policy to have effect

                      Deprecated: use targetRefs/targetSelectors instead
                    properties:
                      group:
                        description: Group is the group of the target resource.
                        maxLength: 253
                        pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      kind:
                        description: Kind is kind of the target resource.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                        type: string
                      name:
                        description: Name is the name of the target resource.
                        maxLength: 253
                        minLength: 1
                        type: string
                      sectionName:
                        description: |-
                          SectionName is the name of a section within the target resource. When
                          unspecified, this targetRef targets the entire resource. In the following
                          resources, SectionName is interpreted as the following:

                          * Gateway: Listener name
                          * HTTPRoute: HTTPRouteRule name
                          * Service: Port name

                          If a SectionName is specified, but does not exist on the targeted object,
                          the Policy must fail to attach, and the policy implementation should record
                          a `ResolvedRefs` or similar Condition in the Policy's status.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - group
                    - kind
                    - name
                    type: object
                  targetRefs:
                    description: |-
                      TargetRefs are the names of the Gateway resources this policy
                      is being attached to.
                    items:
                      description: |-
                        LocalPolicyTargetReferenceWithSectionName identifies an API object to apply a
                        direct policy to. This should be used as part of Policy resources that can
                        target single resources. For more information on how this policy attachment
                        mode works, and a sample Policy resource, refer to the policy attachment
                        documentation for Gateway API.

                        Note: This should only be used for direct policy attachment when references
                        to SectionName are actually needed. In all other cases,
                        LocalPolicyTargetReference should be used.
                      properties:
                        group:
                          description: Group is the group of the target resource.
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          description: Kind is kind of the target resource.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        name:
                          description: Name is the name of the target resource.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sectionName:
                          description: |-
                            SectionName is the name of a section within the target resource. When
                            unspecified, this targetRef targets the entire resource. In the following
                            resources, SectionName is interpreted as the following:

                            * Gateway: Listener name
                            * HTTPRoute: HTTPRouteRule name
                            * Service: Port name

                            If a SectionName is specified, but does not exist on the targeted object,
                            the Policy must fail to attach, and the policy implementation should record
                            a `ResolvedRefs` or similar Condition in the Policy's status.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                    type: array
                  targetSelectors:
                    description: TargetSelectors allow targeting resources for this
                      policy based on labels
                    items:
                      properties:
                        group:
                          default: gateway.networking.k8s.io
                          description: Group is the group that this selector targets.
                            Defaults to gateway.networking.k8s.io
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          description: Kind is the resource kind that this selector
                            targets.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        matchExpressions:
                          description: MatchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: MatchLabels are the set of label selectors
                            for identifying the targeted resource.
                          type: object
                        namespaces:
                          description: |-
                            Namespaces determines which namespaces are considered for target selection.

                            If unspecified, only targets in the same namespace as this policy are considered.

                            When specified, the effective set of namespaces is always constrained to the
                            namespaces watched by Envoy Gateway.

                            Selecting targets across namespaces requires a ReferenceGrant in the target
                            namespace that allows this policy kind to reference the selected target kind.
                            Cross-namespace targets without a matching ReferenceGrant are ignored.
                          properties:
                            from:
                              default: Same
                              description: |-
                                From indicates how namespaces are selected for this target selector.

                                All means all namespaces watched by Envoy Gateway.
                                Selector means namespaces watched by Envoy Gateway that match Selector.
                              enum:
                              - Same
                              - All
                              - Selector
                              type: string
                            selector:
                              description: Selector selects namespaces when From is
                                set to Selector.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                          required:
                          - from
                          type: object
                          x-kubernetes-validations:
                          - message: selector must be specified when from is Selector
                            rule: self.from != 'Selector' || has(self.selector)
                      required:
                      - kind
                      type: object
                      x-kubernetes-validations:
                      - message: group must be gateway.networking.k8s.io
                        rule: 'has(self.group) ? self.group == ''gateway.networking.k8s.io''
                          : true '
                    type: array
                type: object
              provider:
                description: |-
                  Provider selects the data-plane control plane that will receive the ECDS
                  filter slot (Envoy Gateway Extension Server hooks, or Istio EnvoyFilter).
                  Rule/plugin configuration is always pushed over gRPC ECDS regardless of provider.
                properties:
                  ecdsCluster:
                    default: kubewaf_ecds
                    description: ECDSCluster is the Envoy cluster name used to open
                      the ECDS gRPC stream.
                    type: string
                  ecdsService:
                    description: |-
                      ECDSService is host:port of the kubeWAF ECDS gRPC Service
                      (e.g. kubewaf-ecds.kubewaf-system.svc.cluster.local:18001).
                    type: string
                  istio:
                    description: Istio holds Istio-specific slot settings (only used
                      when Type=Istio).
                    properties:
                      context:
                        default: GATEWAY
                        description: Context is the Istio EnvoyFilter match context
                          (GATEWAY, SIDECAR_INBOUND, ...).
                        type: string
                      workloadSelector:
                        additionalProperties:
                          type: string
                        description: 'WorkloadSelector labels for the EnvoyFilter
                          (default: istio=ingressgateway).'
                        type: object
                    type: object
                  type:
                    default: Auto
                    description: Type selects EnvoyGateway, Istio, or Auto (default
                      EnvoyGateway).
                    enum:
                    - Auto
                    - EnvoyGateway
                    - Istio
                    type: string
                type: object
              ruleRefs:
                description: |-
                  RuleSetRefs references RuleSets (or other RuleSets recursively).
                  Resolution, back-references, and status conditions are handled
                  automatically by the shared RuleRefResolver.
                items:
                  properties:
                    group:
                      type: string
                    kind:
                      description: |-
                        Kind specifies the type of resource being referenced.
                        Supported: "SecRule", "SecAction", "RuleSet", "ConfigMap".
                        Note: non-RuleSet owners (e.g. WAFInstance) may ONLY reference "RuleSet"
                        (enforced in internal/references2/resolver.go; future webhook planned).
                      type: string
                    name:
                      description: Name is the name of the referenced resource (SecRule/SecAction/RuleSet).
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referenced resource.
                        Defaults to the namespace of the referencing object if omitted.
                      type: string
                    selector:
                      description: Selector selects resources by labels. If set, Name
                        is ignored.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    version:
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: name or selector required
                    rule: has(self.selector) || has(self.name)
                  - message: name and selector are mutually exclusive
                    rule: '!(has(self.selector) && has(self.name))'
                type: array
            type: object
            x-kubernetes-validations:
            - message: crs tuning requires crsEnable=true
              rule: '!has(self.crs) || self.crsEnable'
          status:
            description: status defines the observed state of WAF
            properties:
              conditions:
                description: Conditions represent the current state of the WAF resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ecdsResourceName:
                description: ECDSResourceName is the ECDS extension config name (HTTP
                  filter name).
                type: string
              ecdsVersion:
                description: ECDSVersion is the snapshot version counter last published
                  for this WAF.
                format: int64
                type: integer
              provider:
                description: Provider is the resolved data-plane provider (EnvoyGateway
                  or Istio).
                enum:
                - Auto
                - EnvoyGateway
                - Istio
                type: string
              slotKind:
                description: |-
                  SlotKind is the platform slot resource kind (e.g. EnvoyFilter, or
                  "ExtensionServer" when EG hooks own the slot).
                type: string
              slotName:
                description: SlotName is the platform slot resource name when one
                  is created.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
