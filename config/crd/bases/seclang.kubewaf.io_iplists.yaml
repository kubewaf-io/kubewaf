---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: iplists.seclang.kubewaf.io
spec:
  group: seclang.kubewaf.io
  names:
    categories:
    - waf
    - security
    kind: IPList
    listKind: IPListList
    plural: iplists
    shortNames:
    - ipl
    singular: iplist
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.fileName
      name: FileName
      type: string
    - jsonPath: .status.sizeBytes
      name: Size
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          IPList is a namespaced IP/CIDR list body for @ipMatchFromFile / @ipMatchF.
          Injected via the same plugin data_files path as PhraseList.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IPList.
            properties:
              configMapRef:
                description: ConfigMapRef loads a single key from a ConfigMap in the
                  same namespace.
                properties:
                  key:
                    description: Key within the ConfigMap data map.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the ConfigMap.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              content:
                description: |-
                  Content is the raw file body (one IP or CIDR per line, # comments allowed).
                  Mutually exclusive with ConfigMapRef and Parts.
                maxLength: 786432
                type: string
              fileName:
                description: |-
                  FileName is the basename used in SecRule operator.value for
                  @ipMatchFromFile / @ipMatchF (e.g. "e2e-ip-blocklist.data").
                  Discovery uses a field index, not labels.
                maxLength: 253
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*\.data$
                type: string
              parts:
                description: |-
                  Parts composes multiple same-namespace ConfigMap keys (in order).
                  Composed size ≤ 2 MiB (controller-enforced).
                items:
                  description: IPListPart is one ConfigMap segment when composing
                    large lists.
                  properties:
                    configMapRef:
                      description: ConfigMapRef of this part.
                      properties:
                        key:
                          description: Key within the ConfigMap data map.
                          minLength: 1
                          type: string
                        name:
                          description: Name of the ConfigMap.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - configMapRef
                  type: object
                maxItems: 16
                minItems: 1
                type: array
            required:
            - fileName
            type: object
            x-kubernetes-validations:
            - message: exactly one of content, configMapRef, or parts is required
              rule: '[has(self.content), has(self.configMapRef), has(self.parts)].filter(x,
                x).size() == 1'
          status:
            description: status defines the observed state of IPList.
            properties:
              conditions:
                description: Conditions represent the current state of the IPList.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentHash:
                description: ContentHash is sha256 hex of the composed body.
                type: string
              fileName:
                description: FileName mirrors spec.fileName once Ready (for indexes
                  / UX).
                type: string
              sizeBytes:
                description: SizeBytes is the composed body size.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
