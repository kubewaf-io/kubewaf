# v1alpha1 operator RBAC. The chart templates in charts/kubewaf-v1alpha1
# carry the same rules. This file is not installed by kustomization.yaml.
# envoyproxies and gateways are get, list, and watch only.
# secpolicies includes update and patch because the finalizer is a full-object update.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubewaf-v1alpha1
rules:
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules", "secactions", "includes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules/status", "secactions/status", "includes/status", "secpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secpolicies/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyextensionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyproxies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
# Write access to kubewaf-seclang is a Role in the proxy namespace, not a cluster-wide create.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubewaf-v1alpha1
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
