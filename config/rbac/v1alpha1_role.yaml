# v1alpha1 operator RBAC. Not installed by the chart or config/rbac/kustomization.yaml.
# M3 binds this when the chart switches to cmd/operator.
# envoyproxies and gateways are get, list, and watch only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubewaf-v1alpha1
rules:
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules", "secactions", "includes", "secpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secrules/status", "secactions/status", "includes/status", "secpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seclang.kubewaf.io"]
    resources: ["secpolicies/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyextensionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyproxies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
# Write access to kubewaf-seclang is a Role in the proxy namespace, not a cluster-wide create.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubewaf-v1alpha1
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
