# Basic Envoy config to verify the challenge-proxy-wasm plugin loads and runs.
# This is a minimal passthrough setup for initial verification.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: httpbin
                http_filters:
                  # === Our WASM plugin ===
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: "challenge-proxy-wasm"
                        # configuration:
                        #   "@type": type.googleapis.com/google.protobuf.StringValue
                        #   value: |
                        #     {
                        #       "header": "x-wasm-header",
                        #       "value": "demo-wasm",
                        #       "secret": "change-this-to-a-strong-secret-in-prod",
                        #       "base_difficulty": 18,
                        #       "min_difficulty": 12,
                        #       "max_difficulty": 26
                        #     }
                        vm_config:
                          runtime: "envoy.wasm.runtime.v8"
                          vm_id: "challenge_vm"
                          code:
                            local:
                              filename: /etc/envoy/plugin.wasm
                  # Router must come after the WASM filter
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: httpbin
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: httpbin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: httpbin
                      port_value: 80
