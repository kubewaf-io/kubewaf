services:
  envoy:
    # Standard Envoy image works with Go wasip1 WASM + V8 runtime.
    image: envoyproxy/envoy:v1.33-latest
    ports:
      - "8080:8080"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Mount the built WASM plugin from the project root
      - ../../build/main.wasm:/etc/envoy/plugin.wasm:ro
    command: >
      envoy -c /etc/envoy/envoy.yaml --log-level debug
    # Use debug logging while verifying the WASM plugin loads.
    # Once it works, you can change back to "info".

  # Simple backend for testing
  httpbin:
    image: kennethreitz/httpbin
    ports:
      - "8081:80"
    # Not exposed to host by default - only Envoy talks to it
