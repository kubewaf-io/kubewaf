name: E2E Envoy Gateway

# Fast gate: Envoy Gateway smoke (WAF Ready + traffic).
# - PR + push to main: this workflow only
# - Full provider/FTW matrix: test-e2e-release.yml on PRs and before release (not on main)

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: e2e-eg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-envoy-gateway:
    name: Envoy Gateway e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.3

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.32.0

      - name: v1alpha1 Kind e2e
        run: bash test/e2e/v1alpha1/run.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "=== pods ==="
          kubectl get pods -A
          echo "=== waf ==="
          kubectl get waf -A -o wide 2>/dev/null
          echo "=== operator logs ==="
          kubectl logs -n kubewaf-system -l app.kubernetes.io/instance=kubewaf --tail=200 2>/dev/null
          echo "=== validating webhooks ==="
          kubectl get validatingwebhookconfiguration 2>/dev/null
