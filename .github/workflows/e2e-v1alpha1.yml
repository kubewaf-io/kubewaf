name: E2E v1alpha1

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: e2e-v1alpha1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: Kind Envoy Gateway v1.10
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-$(go env GOARCH)"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: v1alpha1 Kind e2e
        run: bash test/e2e/v1alpha1/run.sh
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl get pods -A
          kubectl get envoyproxy,gateway,httproute,secrule,secpolicy,envoyextensionpolicy -A
          kubectl logs -n kubewaf-system -l app.kubernetes.io/name=kubewaf --tail=200
          kubectl logs -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=eg -c envoy --tail=100
