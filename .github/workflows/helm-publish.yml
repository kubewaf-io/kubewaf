name: Publish charts
permissions: read-all

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tag release. The OCI tag and appVersion are the git tag (v1.2.3), which is
# also the operator image tag. Preview releases call publish-charts.yml with a
# semver prerelease and a matching sha image tag.
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read
    uses: ./.github/workflows/publish-charts.yml
    with:
      chart-version: ${{ github.ref_name }}
      app-version: ${{ github.ref_name }}
