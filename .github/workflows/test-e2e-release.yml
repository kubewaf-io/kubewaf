name: E2E Release (full)

# Release gate. The v1beta1 provider matrix (Istio, Cilium, FTW, probe) is gone.
# This runs the v1alpha1 Kind e2e. workflow_call inputs are accepted so the
# releaser's with: block still parses; they are not used.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ftw_include:
        description: "Unused. Kept so the releaser call still parses."
        type: string
        required: false
        default: "^913"
      run_path_b:
        description: "Unused."
        type: boolean
        required: false
        default: true
      run_istio:
        description: "Unused."
        type: boolean
        required: false
        default: true
      run_cilium:
        description: "Unused."
        type: boolean
        required: false
        default: true
  workflow_dispatch:

jobs:
  kind:
    name: Kind Envoy Gateway v1.10
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-$(go env GOARCH)"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
      - name: v1alpha1 Kind e2e
        run: bash test/e2e/v1alpha1/run.sh
