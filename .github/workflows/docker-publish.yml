name: Publish images
permissions: {}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tag release. KO_TAGS_OVERRIDE is left empty, so the image is tagged with the
# git tag and latest. Preview releases call publish-images.yml directly.
jobs:
  publish:
    permissions:
      packages: write
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/publish-images.yml
    with:
      image-tag: ${{ github.ref_name }}
