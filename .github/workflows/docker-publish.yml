name: Publish images
permissions: {}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Publishes every ko image the chart can pull:
#   ghcr.io/<org>/kubewaf
#   ghcr.io/<org>/kubewaf-subresource-api
#   ghcr.io/<org>/kubewaf-probe-test-server
jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    outputs:
      controller-digest: ${{ steps.publish-controller.outputs.digest }}
      subresource-api-digest: ${{ steps.publish-subresource-api.outputs.digest }}
      probe-test-server-digest: ${{ steps.publish-probe-test-server.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy vulnerability (Repo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Publish Controller
        id: publish-controller
        uses: peak-scale/github-actions/make-ko-publish@a441cca016861c546ab7e065277e40ce41a3eb84 # v0.2.0
        with:
          makefile-target: ko-publish-controller
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}
          version: ${{ github.ref_name }}
          sign-image: true
          sbom-name: kubewaf
          sbom-repository: ghcr.io/${{ github.repository_owner }}/kubewaf
          signature-repository: ghcr.io/${{ github.repository_owner }}/kubewaf
          main-path: ./cmd/
        env:
          REPOSITORY: ${{ github.repository }}
      - name: Publish Subresource API
        id: publish-subresource-api
        uses: peak-scale/github-actions/make-ko-publish@a441cca016861c546ab7e065277e40ce41a3eb84 # v0.2.0
        with:
          makefile-target: ko-publish-subresource-api
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}
          version: ${{ github.ref_name }}
          sign-image: true
          sbom-name: kubewaf-subresource-api
          sbom-repository: ghcr.io/${{ github.repository_owner }}/kubewaf-subresource-api
          signature-repository: ghcr.io/${{ github.repository_owner }}/kubewaf-subresource-api
          main-path: ./cmd/subresource-api
        env:
          REPOSITORY: ${{ github.repository }}
      - name: Publish Probe Test Server
        id: publish-probe-test-server
        uses: peak-scale/github-actions/make-ko-publish@a441cca016861c546ab7e065277e40ce41a3eb84 # v0.2.0
        with:
          makefile-target: ko-publish-probe-test-server
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}
          version: ${{ github.ref_name }}
          sign-image: true
          sbom-name: kubewaf-probe-test-server
          sbom-repository: ghcr.io/${{ github.repository_owner }}/kubewaf-probe-test-server
          signature-repository: ghcr.io/${{ github.repository_owner }}/kubewaf-probe-test-server
          main-path: ./cmd/probe-test-server
        env:
          REPOSITORY: ${{ github.repository }}
  generate-provenance:
    needs: publish-images
    permissions:
      id-token: write # To sign the provenance.
      packages: write # To upload assets to release.
      actions: read # To read the workflow path.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/kubewaf
      digest: "${{ needs.publish-images.outputs.controller-digest }}"
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  generate-provenance-subresource-api:
    needs: publish-images
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/kubewaf-subresource-api
      digest: "${{ needs.publish-images.outputs.subresource-api-digest }}"
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  generate-provenance-probe-test-server:
    needs: publish-images
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/kubewaf-probe-test-server
      digest: "${{ needs.publish-images.outputs.probe-test-server-digest }}"
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
