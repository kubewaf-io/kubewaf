services:
  albedo:
    # renovate: datasource=docker depName=ghcr.io/coreruleset/albedo
    image: ghcr.io/coreruleset/albedo:0.2.0

  chown:
    # renovate: datasource=docker depName=alpine
    image: alpine:3.24
    command:
      - /bin/sh
      - -c
      - touch /home/envoy/logs/envoy.log && chown -R 101:101 /home/envoy/logs
    volumes:
      - logs:/home/envoy/logs:rw

  envoy:
    depends_on:
      - chown
      - albedo
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.38-latest}
    command:
      - -c
      - /etc/envoy.yaml
      - --log-level
      - info
      - --component-log-level
      - wasm:debug
      # Short format: free budget under Envoy's ~512-char wasm log line limit so
      # go-ftw can still see [id "N"] and X-CRS-Test marker values.
      - --log-format
      - "[%Y-%m-%d %T.%f][%t][%l][%n] %v"
      - --log-path
      - /home/envoy/logs/envoy.log
    volumes:
      - ${MODSECURITY_PROXY_WASM:-../../../dist/modsecurity-proxy-wasm.wasm}:/etc/modsecurity-proxy-wasm.wasm:ro
      - ./envoy.yaml:/etc/envoy.yaml:ro
      - logs:/home/envoy/logs:rw
    ports:
      - "${FTW_HOST_PORT:-18082}:8080"

  ftw:
    depends_on:
      - envoy
    image: ghcr.io/coreruleset/go-ftw:${GO_FTW_VERSION:-2.4.0}
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/tests.sh"]
    environment:
      - FTW_CLOUDMODE=${FTW_CLOUDMODE:-false}
      - FTW_INCLUDE=${FTW_INCLUDE:-}
      - FTW_RATE_LIMIT=${FTW_RATE_LIMIT:-300ms}
      - FTW_MAX_MARKER_RETRIES=${FTW_MAX_MARKER_RETRIES:-40}
      - FTW_MARKER_SETTLE=${FTW_MARKER_SETTLE:-5}
    volumes:
      - logs:/home/envoy/logs:ro
      - ./tests.sh:/workspace/tests.sh:ro
      - ./ftw.yml:/workspace/ftw.yml:ro
      - ${CRS_CACHE:-./.crs-cache}:/workspace/coreruleset:ro

volumes:
  logs: