# k6 performance test stack for modsecurity-proxy-wasm.
#
# Local (Envoy published to host):
#   PERF_PROFILE=modsecurity-proxy-wasm-full PERF_SCENARIO=benign-get ./test/perf/run-k6.sh
#
# Compose-only k6 run (Envoy on docker network):
#   docker compose -f test/perf/docker-compose.k6.yml run --rm k6

services:
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.38-latest}
    container_name: ${PERF_ENVOY_CONTAINER:-modsecurity-proxy-wasm-perf-envoy}
    command: ["envoy", "-c", "/etc/envoy.yaml", "--log-level", "warn"]
    ports:
      - "${PERF_HOST_PORT:-18080}:8080"
      - "${PERF_ADMIN_PORT:-19901}:9901"
    volumes:
      - ${MODSECURITY_PROXY_WASM:-../../dist/modsecurity-proxy-wasm.wasm}:/etc/modsecurity-proxy-wasm.wasm:ro
      - ${CORAZA_WASM:-./.coraza/main.wasm}:/etc/coraza.wasm:ro
      - ./profiles/${PERF_PROFILE:-modsecurity-proxy-wasm-full}.yaml:/etc/envoy.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "${PERF_CPU_LIMIT:-2}"
          memory: ${PERF_MEMORY_LIMIT:-2G}

  k6:
    # renovate: datasource=docker depName=grafana/k6
    image: ${K6_IMAGE:-grafana/k6:0.57.0}
    depends_on:
      - envoy
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      - BASE_URL=http://envoy:8080
      - HOST_HEADER=www.example.com
      - PERF_PROFILE=${PERF_PROFILE:-modsecurity-proxy-wasm-full}
      - PERF_SCENARIO=${PERF_SCENARIO:-benign-get}
      - PERF_VUS=${PERF_VUS:-32}
      - PERF_DURATION=${PERF_DURATION:-60s}
      - PERF_WARMUP=${PERF_WARMUP:-15s}
      - PERF_P99_MS=${PERF_P99_MS:-200}
      - PERF_FAIL_RATE=${PERF_FAIL_RATE:-0.01}
    command:
      - run
      - --summary-export=/results/k6-summary.json
      - /scripts/scenarios/${PERF_SCENARIO:-benign-get}.js