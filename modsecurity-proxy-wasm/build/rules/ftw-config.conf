# modsecurity-proxy-wasm FTW overlay (virtual path: @ftw-conf)
# Adapted from coraza-proxy-wasm ftw-config.conf for CRS go-ftw regression runs.

# httpbin/albedo returns application/json; include it for RESPONSE-body rules.
SecResponseBodyMimeType text/plain text/html text/xml application/json

# crs-setup.conf.example defaults SecDefaultAction only for phases 1 and 2.
# Phases 3–5 must log or go-ftw cannot see triggered rule IDs.
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"
SecDebugLogLevel 3

# Rule 900005 — CRS FTW profile (PL4, detection-only, relaxed limits for 920400-*).
# https://github.com/coreruleset/coreruleset/blob/v4.0/dev/tests/regression/README.md#requirements
SecAction "id:900005,\
  phase:1,\
  nolog,\
  pass,\
  ctl:ruleEngine=DetectionOnly,\
  ctl:ruleRemoveById=910000,\
  setvar:tx.blocking_paranoia_level=4,\
  setvar:tx.crs_validate_utf8_encoding=1,\
  setvar:tx.arg_name_length=100,\
  setvar:tx.arg_length=400,\
  setvar:tx.total_arg_length=64000,\
  setvar:tx.max_num_args=255,\
  setvar:tx.max_file_size=64100,\
  setvar:tx.combined_file_sizes=65535"

# Log marker for go-ftw log synchronization (X-CRS-Test header).
SecRule REQUEST_HEADERS:X-CRS-Test "@rx ^.*$" \
  "id:999999,\
  phase:1,\
  pass,\
  t:none,\
  log,\
  msg:'X-CRS-Test %{MATCHED_VAR}',\
  ctl:ruleRemoveById=1-999999"