# modsecurity-proxy-wasm demo overlay (virtual path: @demo-conf)
# CRS .data files for @pmFromFile are mounted under /modsecurity-proxy-wasm-rules at plugin start.
SecTmpDir /modsecurity-proxy-wasm-rules
SecDataDir /modsecurity-proxy-wasm-rules

# Response body inspection (CRS RESPONSE-95x data-leakage rules, phase 4).
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial