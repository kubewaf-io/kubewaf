name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Build wasm image and extract modsecurity-proxy-wasm.wasm
        env:
          # Makefile prefers podman when both are installed; pin docker on GH Actions.
          CTR: docker
        run: |
          make image IMAGE=modsecurity-proxy-wasm:ci
          make extract-wasm IMAGE=modsecurity-proxy-wasm:ci
      - name: Upload modsecurity-proxy-wasm.wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: modsecurity-proxy-wasm
          path: dist/
          retention-days: 1
          if-no-files-found: error

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y git g++
      - name: Unit tests (gtest)
        run: make deps-test test-unit

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: getentropy policy check
        run: make verify-getentropy-stub

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download modsecurity-proxy-wasm.wasm
        uses: actions/download-artifact@v4
        with:
          name: modsecurity-proxy-wasm
          path: dist
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ curl wabt
      - name: Pre-pull Envoy image
        run: docker pull envoyproxy/envoy:v1.38-latest
      - name: Bats integration tests
        run: make test-bats ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest

  ftw-subset:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download modsecurity-proxy-wasm.wasm
        uses: actions/download-artifact@v4
        with:
          name: modsecurity-proxy-wasm
          path: dist
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ curl wabt
      - name: CRS go-ftw subset (XSS rules)
        run: make test-regression FTW_INCLUDE='^941.*' ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y git clang wabt
      - name: libFuzzer smoke
        run: make deps-test test-fuzz

  perf:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download modsecurity-proxy-wasm.wasm
        uses: actions/download-artifact@v4
        with:
          name: modsecurity-proxy-wasm
          path: dist
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 python3-matplotlib
      - name: k6 performance smoke (baseline + modsecurity-proxy-wasm/coraza pairs)
        run: make test-perf-k6-ci ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest
      - name: Render perf overlay chart
        if: always()
        run: make test-perf-charts
      - name: Verify perf charts
        if: always()
        run: |
          test -f test/perf/release-charts/perf-overlay.png
          test -f test/perf/release-charts/memory-overlay.png
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            test/perf/results/**/k6-report.html
            test/perf/results/**/k6-compare.html
            test/perf/results/**/k6-summary.json
            test/perf/results/**/k6-stdout.txt
            test/perf/release-charts/perf-overlay.png
            test/perf/release-charts/memory-overlay.png
          retention-days: 14
          if-no-files-found: ignore